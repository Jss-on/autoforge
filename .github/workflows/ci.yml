name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Harness test suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run all suites
        run: |
          set -e
          fail=0
          for t in tests/test-*.sh; do
            echo "== $t"
            bash "$t" || fail=1
          done
          exit $fail
      - name: Seam smoke (deterministic end-to-end pipeline)
        run: bash scripts/smoke-seam.sh

  # The model-drift alarm. Costs real tokens, needs CLAUDE_CODE_OAUTH_TOKEN or
  # ANTHROPIC_API_KEY as a repo secret — manual dispatch only.
  model-smoke:
    name: Model smoke (drift alarm)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.268
      - name: Run headless micro-build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AR_SMOKE_MODEL: "1"
        run: bash scripts/smoke-model.sh
