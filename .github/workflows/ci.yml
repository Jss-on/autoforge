name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Harness test suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run all suites
        run: |
          set -e
          fail=0
          for t in tests/test-*.sh; do
            echo "== $t"
            bash "$t" || fail=1
          done
          exit $fail
      - name: Seam smoke (deterministic end-to-end pipeline)
        run: bash scripts/smoke-seam.sh

  windows-smoke:
    name: Harness Windows smoke
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Windows execution and installed package seams
        run: |
          set -e
          for t in acceptance verification ci-evidence delivery recovery operations delivery-metrics release-eval codex-plugin; do
            bash "tests/test-$t.sh"
          done
          bash scripts/smoke-seam.sh

  # Model evaluations run locally with subscription logins. Release policy pins
  # their report digest and independently verifies these hosted CI jobs.
