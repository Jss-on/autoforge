name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight. Master pushes always finish:
# release policy verifies them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Harness test suites
          - os: windows-latest
            name: Harness Windows smoke
          - os: macos-latest
            name: Harness macOS test suites
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run all suites
        run: |
          # Exercise macOS's system Bash and BSD tools, even if Homebrew is installed.
          if [[ "$RUNNER_OS" == macOS ]]; then export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"; fi
          # The 35 suites are independent; four at a time matches the hosted runners' cores.
          bash scripts/run-suites.sh
      - name: Seam smoke (deterministic end-to-end pipeline)
        run: bash scripts/smoke-seam.sh

  # Model evaluations run locally with subscription logins. Release policy pins
  # their report digest and independently verifies these hosted CI jobs.
