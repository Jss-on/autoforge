name: Isolated Forge pilot build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/forge-pilot-build.yml'
      - 'evals/devops/pilot/**'
      - 'tests/pilot-signals.cjs'
      - 'tests/restore-fixture.cjs'
permissions:
  contents: read
env:
  PILOT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  build:
    name: Pilot build and journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PILOT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: node tests/pilot-signals.cjs .
      - name: Produce immutable prebuilt output without deployment credentials
        run: node evals/devops/pilot/build.cjs pilot-work "$PILOT_SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: pilot-work/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  compatibility:
    name: Offline recovery fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PILOT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: node tests/restore-fixture.cjs .
      # SQLite is an offline regression fixture. Live schema/restore evidence
      # must also match the selected Neon branch before authorizing recovery.
