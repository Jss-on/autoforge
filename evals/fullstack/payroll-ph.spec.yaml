# GENERATED by forge:requirements via 4-round interactive interview (no assumptions; user-approved 2026-06-28).
# Multi-tenant PH payroll SaaS, compute-only, installable PWA. Next.js + Postgres + Prisma.
# Weights from MoSCoW (Must=2, Should=1). Priority: statutory correctness over speed.
name: payroll-ph
summary: Multi-tenant Philippine payroll SaaS (compute-only) — employees, attendance/leave, PH statutory engine (SSS/PhilHealth/Pag-IBIG/BIR/13th-month/premiums), payslips + bank file + remittance reports; installable PWA, RBAC, audit, DPA baseline.
stack:
  language: typescript
  framework: nextjs
  rendering: server + client (app router)
  datastore: postgres
  orm: prisma
  auth: email-password (credentials) + role-based access control
  pdf: server-side PDF generation (payslips)
  test: vitest + testing-library + playwright
  pwa: manifest + service-worker
  deploy: docker + node server

design:
  source: file
  ref: DESIGN.md  # Vercel design language — adopted via forge:feature (was: generated fintech)

acceptance:
  functional:
    - id: f-tenancy-isolation
      assert: super-admin CRUDs tenant companies; a user of company A requesting company B data gets 403, no cross-tenant leak
      weight: 2
      traces: [FR-1, NFR-1]
    - id: f-auth-rbac
      assert: email/password login works; each of the 4 roles (super-admin, company-admin, manager, employee) is limited to its permitted actions
      weight: 2
      traces: [FR-2, NFR-1]
    - id: f-employee-crud-import
      assert: valid employee CSV bulk-imports (TIN/SSS/PhilHealth/Pag-IBIG/bank fields); invalid rows rejected with errors; manual add/edit/delete persists
      weight: 2
      traces: [FR-3]
    - id: f-pay-config
      assert: per-company pay frequency (weekly/semi-monthly/monthly) + base pay + allowances + deductions persist and drive pay runs
      weight: 2
      traces: [FR-4]
    - id: f-attendance
      assert: timesheet/clock entries with overtime hours are captured per period and feed the pay computation
      weight: 2
      traces: [FR-5]
    - id: f-leave
      assert: leave types + balances; employee request -> manager approval; approved unpaid leave reduces net pay and updates balance
      weight: 2
      traces: [FR-6]
    - id: f-contributions
      assert: SSS, PhilHealth, Pag-IBIG employee+employer shares computed per current PH tables for a known salary (reference case)
      weight: 2
      traces: [FR-7]
    - id: f-bir-withholding
      assert: BIR graduated withholding per pay period matches the table; year-end annualization reconciles for a reference employee
      weight: 2
      traces: [FR-8]
    - id: f-13th-month
      assert: pro-rated 13th-month pay computed correctly from months worked and reported
      weight: 2
      traces: [FR-9]
    - id: f-premium-pay
      assert: overtime, regular/special holiday, night-differential, rest-day premiums apply correct DOLE multipliers from attendance
      weight: 2
      traces: [FR-10]
    - id: f-payrun-workflow
      assert: pay run create -> compute -> review -> approve -> finalize; finalized run is locked/immutable and outputs unlock
      weight: 2
      traces: [FR-11]
    - id: f-outputs
      assert: finalized run produces PDF payslips, bank disbursement CSV, statutory remittance reports (SSS/PhilHealth/Pag-IBIG/BIR), and payroll register
      weight: 2
      traces: [FR-12]
    - id: f-self-service
      assert: employee logs in and views/downloads own payslips + tax docs, updates permitted personal info, and requests leave
      weight: 2
      traces: [FR-13]
    - id: f-audit-log
      assert: sensitive actions (login, data edit, pay-run finalize) write an audit entry with actor + timestamp
      weight: 2
      traces: [FR-14, NFR-3]
    - id: f-statutory-correctness-tests
      assert: statutory engine unit tests pass against known reference cases; coverage >= 80
      weight: 2
      traces: [NFR-11]
    - id: f-export-formats
      assert: payroll register/summary exports to CSV/Excel
      weight: 1
      traces: [FR-12]
  ux:
    - id: ux-responsive
      assert: admin payroll screens + employee self-service render at 375/768/1280 without overflow
      weight: 2
      traces: [NFR-5, design:spacing]
    - id: ux-a11y
      assert: axe via /browse reports zero serious/critical on login, employee list, pay-run review, and self-service payslip screens
      weight: 2
      traces: [NFR-6, design:color]
    - id: ux-pwa-offline
      assert: valid manifest + registered service worker; app is installable and shell loads offline after first visit
      weight: 2
      traces: [NFR-5]
    - id: ux-e2e-payrun
      assert: /browse drives admin through create -> compute -> approve -> finalize a pay run and download a payslip PDF
      weight: 2
      traces: [FR-11, NFR-5]
    - id: ux-self-service-flow
      assert: /browse drives an employee login -> view payslip -> submit a leave request successfully
      weight: 2
      traces: [FR-13]
    - id: ux-states
      assert: loading / empty (no employees, no pay runs) / error states render on key screens
      weight: 1
      traces: [NFR-5, design:states]
    - id: ux-design-conformance
      assert: live UI matches DESIGN.md tokens (type scale, color palette, spacing, radius, motion) sampled across admin + self-service
      weight: 2
      traces: [NFR-7, design:type, design:color, design:spacing, design:radius, design:motion]
    - id: ux-theme-vercel
      assert: live UI conforms to the adopted Vercel DESIGN.md — ink pill CTAs, hairline cards, mono eyebrows, canvas-soft surfaces; axe stays 0 serious/critical
      weight: 2
      traces: [NFR-7, design:color, design:radius]
  devops:
    - id: dev-build
      assert: production Next.js build succeeds
      weight: 2
      traces: [NFR-10]
    - id: dev-ci
      assert: CI runs lint + test + build + dependency-scan green
      weight: 2
      traces: [NFR-10]
    - id: dev-migrations
      assert: Prisma migrations apply cleanly to a fresh Postgres database
      weight: 2
      traces: [NFR-10]
    - id: dev-docker-deploy
      assert: Docker image builds and the app boots against Postgres via env config
      weight: 1
      traces: [NFR-10]
    - id: dev-env-config
      assert: required env vars validated at startup; app fails fast with a clear message if missing
      weight: 1
      traces: [NFR-10]
  monitoring:
    - id: mon-health
      assert: /health (or equivalent) endpoint returns ok with DB connectivity check
      weight: 2
      traces: [NFR-8]
    - id: mon-structured-logs
      assert: structured request/error logs emitted; no PII in log lines
      weight: 1
      traces: [NFR-8, NFR-3]
    - id: mon-error-boundary
      assert: React error boundary present; console clean during e2e flows
      weight: 1
      traces: [NFR-8]
    - id: mon-web-vitals
      assert: core web vitals (LCP/CLS/INP) captured + logged
      weight: 1
      traces: [NFR-8]
    - id: mon-payrun-perf
      assert: a pay run for ~50 employees completes within p95 < 5s and the duration is logged
      weight: 2
      traces: [NFR-9]
  hardening:
    - id: hard-authn
      assert: passwords hashed (bcrypt/argon2); sessions secure; no plaintext credential storage
      weight: 2
      traces: [FR-2]
    - id: hard-rbac-server
      assert: every API route enforces role + tenant authorization server-side; unauthorized returns 403
      weight: 2
      traces: [NFR-1]
    - id: hard-tenant-isolation
      assert: queries are tenant-scoped; cross-tenant access is impossible even with forged ids
      weight: 2
      traces: [NFR-1]
    - id: hard-encryption
      assert: TLS in transit; sensitive PII (TIN, SSS, bank account) encrypted at rest
      weight: 2
      traces: [NFR-2]
    - id: hard-input-validation
      assert: invalid input (amount/date/CSV row) rejected with inline error and not persisted
      weight: 2
      traces: [NFR-4]
    - id: hard-xss-sqli
      assert: user-supplied text rendered escaped (no script execution); parameterized queries via Prisma (no SQLi)
      weight: 2
      traces: [NFR-4]
    - id: hard-pii-privacy
      assert: PH Data Privacy Act baseline — least-privilege access; PII never appears in logs or error responses
      weight: 2
      traces: [NFR-3]
    - id: hard-csp-headers
      assert: CSP + security headers (nosniff, frame-options/frame-ancestors) configured
      weight: 1
      traces: [NFR-4]
    - id: hard-dep-scan
      assert: npm audit clean above moderate severity
      weight: 1
      traces: [NFR-10]
