# forge:build eval spec — declares what to build + per-dimension acceptance.
# Generated by forge:requirements (260628-1637) from a signed-off SRS.
# Product: "Fireworks POS" — offline, self-hosted LAN point-of-sale for a fireworks retail shop.
name: fireworks-pos
summary: >-
  Offline, self-hosted Point-of-Sale for a fireworks retail shop. Runs as a
  server on ONE host PC; cashier/admin devices on the SAME LAN reach the full
  web app via a browser at http://<lan-ip>:<port>. Cash-only checkout with
  change calculation and an 80mm thermal + PDF receipt (no tax). Inventory with
  stock-in/receiving recording batch/lot + supplier (lot -> sales recall trace),
  low-stock reorder flags, cost price + margin, and manual stock adjustments.
  Sales analytics: revenue over time, top/slow products, sales by cashier, and
  profit/margin. Multi-user: Superadmin (everything) + Cashier (sell + permitted
  refunds), username+password, server-side authorization. Returns/refunds/voids
  restore stock with an audit trail. Fully responsive (desktop/tablet/phone,
  >=375px). Single-file SQLite (WAL) on the host PC; double-click launcher starts
  the server, runs migrations, detects + prints the LAN URL. Nightly + one-click
  backups, CSV export. Currency PHP. No internet dependency at runtime (works
  air-gapped on the LAN). Adopts the provided Vercel-inspired DESIGN.md.
stack:
  language: typescript
  runtime: node
  framework: express            # API + serves the built SPA on 0.0.0.0:<port> for LAN access
  frontend: react+vite+tailwind # responsive SPA; DESIGN.md tokens via Tailwind theme
  datastore: sqlite             # better-sqlite3, WAL mode; single file on the host PC
  orm: prepared-statements      # parameterized SQL only (no string-concatenated queries)
  auth: bcrypt + httpOnly cookie sessions + CSRF
  validation: zod               # every API boundary
  deploy: self-hosted-lan       # double-click launcher (Windows) + optional docker compose
  offline: true                 # no CDN/remote fonts/APIs at runtime; assets bundled locally
  port: 3008                    # default; launcher auto-detects LAN IPv4
  test: vitest+playwright
design:
  source: file                  # catalog | file | url | generate
  ref: "C:\\Users\\tenso\\forge\\DESIGN.md"   # Vercel-inspired; build adopts it as project DESIGN.md

acceptance:
  functional:
    - id: builds
      assert: production build (server + SPA) succeeds from a clean checkout
      weight: 2
      traces: [NFR-24]
    - id: boots
      assert: server starts and serves the SPA + login screen on localhost
      weight: 2
      traces: [FR-1]
    - id: auth-login
      assert: valid username+password starts a session; invalid credentials are rejected
      weight: 2
      traces: [FR-1]
    - id: user-crud
      assert: a Superadmin can create, edit, deactivate, and reset the password of cashier/admin users; deactivated users cannot log in
      weight: 2
      traces: [FR-3]
    - id: product-crud
      assert: products CRUD with name, SKU, category, sell price, cost price, reorder point, and active flag; persisted to SQLite
      weight: 2
      traces: [FR-4]
    - id: product-search
      assert: typeahead search by name/SKU returns matches (no barcode scanner) over a medium catalog
      weight: 2
      traces: [FR-5]
    - id: stock-in-lot
      assert: stock-in/receiving adds quantity recording batch/lot + supplier + unit cost + date; a recall query maps a lot to the sales that drew from it
      weight: 2
      traces: [FR-6, FR-10]
    - id: stock-math
      assert: finalizing a sale decrements on-hand by the sold quantity within the same transaction; on-hand never goes negative silently
      weight: 2
      traces: [FR-7]
    - id: stock-adjustments
      assert: manual stock adjustments (+/-) require a reason (damage/loss/recount) and write an audit row
      weight: 1
      traces: [FR-8]
    - id: low-stock
      assert: products at/below their reorder point are flagged low-stock on the dashboard
      weight: 1
      traces: [FR-9]
    - id: checkout-cash
      assert: a sale is built from searched products with quantities; cash tendered >= total yields change = cash - total; the sale finalizes (cash only, no tax)
      weight: 2
      traces: [FR-11, FR-12]
    - id: receipt
      assert: a finalized sale prints an 80mm-thermal-formatted receipt and downloads a PDF, both showing shop header, line items, total, cash/change, datetime, cashier, transaction number, and no tax line
      weight: 2
      traces: [FR-13]
    - id: refund-void
      assert: a completed sale can be refunded (full or per-line) and an in-progress sale voided; stock is restored, a refund record + audit row are written, and a refund receipt is available
      weight: 2
      traces: [FR-14]
    - id: sale-persist
      assert: every finalized sale persists line items, quantities, prices, cashier, timestamp, tender, change, and lot links, all queryable
      weight: 2
      traces: [FR-15]
    - id: analytics-over-time
      assert: a dashboard reports revenue + transaction count by day/week/month with a chart
      weight: 1
      traces: [FR-16]
    - id: analytics-top-slow
      assert: top and slow-moving products by quantity and revenue compute over a chosen date range
      weight: 1
      traces: [FR-17]
    - id: analytics-by-cashier
      assert: sales totals + transaction counts per cashier compute over a date range
      weight: 1
      traces: [FR-18]
    - id: analytics-margin
      assert: profit/margin (revenue minus cost using cost price) computes by period and product
      weight: 1
      traces: [FR-19]
    - id: settings
      assert: shop settings persist receipt header/footer, currency (PHP default), and default low-stock threshold
      weight: 1
      traces: [FR-20]
    - id: tests-green
      assert: vitest unit suite passes with coverage >= 80 on core logic (change calc, stock math, refund/restock, margin, authz)
      weight: 1
      traces: [NFR-23]
    - id: product-image-upload
      assert: a product image (png/jpeg/webp) uploads via product CRUD, persists, and is served by the app at its imageUrl
      weight: 2
      traces: [FR-24]
    - id: product-image-remove
      assert: an uploaded product image can be removed; the product reverts to no image and the file is deleted
      weight: 1
      traces: [FR-25]
  ux:
    - id: responsive
      assert: core flows (login, checkout, inventory, reports) render and are usable at 375px / 768px / 1280px; checkout touch targets >= 44px
      weight: 2
      traces: [NFR-1, design:spacing]
    - id: states
      assert: every data view has explicit loading / empty / error states; no dead ends
      weight: 1
      traces: [NFR-3, design:states]
    - id: e2e-flow
      assert: /browse drives login -> search product -> cash sale + change -> receipt -> refund; plus a stock-in and a report load
      weight: 2
      traces: [NFR-5]
    - id: a11y
      assert: axe scan via /browse reports zero serious/critical violations on core screens; menus and checkout are keyboard-operable
      weight: 1
      traces: [NFR-2]
    - id: design-conformance
      assert: live computed styles match DESIGN.md tokens (Vercel-inspired type/color/spacing/radius/elevation/states); no off-system slop
      weight: 2
      traces: [NFR-4, design:type, design:color, design:spacing, design:radius, design:motion, design:states]
    - id: product-image-ui
      assert: product form shows a live image preview; products table + checkout show rounded DESIGN.md-radius thumbnails; axe stays clean
      weight: 1
      traces: [NFR-25, design:radius]
  devops:
    - id: launcher-migrations
      assert: a double-click launcher on the host PC starts the server and runs DB migrations on first run (idempotent on restart), printing/opening the LAN URL
      weight: 2
      traces: [FR-22, NFR-18]
    - id: lan-access
      assert: the server binds 0.0.0.0:<port> and the full app is reachable from another same-LAN device's browser at http://<lan-ip>:<port>
      weight: 2
      traces: [FR-23]
    - id: sqlite-persist
      assert: data persists in a single SQLite (WAL) file on the host PC and survives a server restart
      weight: 2
      traces: [NFR-19]
    - id: backup-restore
      assert: one-click manual backup + nightly auto-backup of the DB to a configurable folder; restoring on a fresh start reproduces the data; CSV export of products & sales opens in a spreadsheet
      weight: 1
      traces: [FR-21]
    - id: concurrency-integrity
      assert: 3-5 terminals selling concurrently never double-decrement stock or corrupt totals (transactional writes)
      weight: 2
      traces: [NFR-22]
    - id: ci
      assert: CI runs lint + typecheck + unit + e2e + build, all green
      weight: 1
      traces: [NFR-20]
    - id: docker
      assert: an optional docker compose path brings the server up on the host PC
      weight: 1
      traces: [NFR-21]
  monitoring:
    - id: health
      assert: GET /health returns OK with version and DB status
      weight: 1
      traces: [NFR-6]
    - id: logs
      assert: structured request + error logs write to a rotating local file with no credential/PII leakage
      weight: 1
      traces: [NFR-7]
    - id: error-boundary
      assert: a UI error boundary shows a graceful error screen (including "server unreachable"), never a blank page
      weight: 1
      traces: [NFR-8]
    - id: perf
      assert: sale-finalize < 300ms server-side, product search < 200ms over 5k items, and dashboard queries < 1s at medium scale
      weight: 2
      traces: [NFR-9]
  hardening:
    - id: auth-bcrypt
      assert: passwords are bcrypt-hashed (no plaintext) and the login endpoint is rate-limited
      weight: 2
      traces: [NFR-10]
    - id: authz
      assert: server-side authorization blocks a Cashier session from admin-only endpoints/data (HTTP 403), independent of the UI
      weight: 2
      traces: [FR-2, NFR-11]
    - id: input-validation
      assert: every API boundary validates input (zod or equivalent) and rejects invalid payloads with a friendly error
      weight: 2
      traces: [NFR-12]
    - id: param-sql
      assert: all database access uses parameterized/prepared statements; no string-concatenated SQL
      weight: 2
      traces: [NFR-13]
    - id: csrf-cookies
      assert: session cookies are httpOnly + SameSite and state-changing requests carry CSRF protection
      weight: 2
      traces: [NFR-14]
    - id: headers-secrets
      assert: security headers are set (helmet) and no secrets exist in the bundle/repo; secret-scan is clean
      weight: 1
      traces: [NFR-15]
    - id: audit-trail
      assert: refunds, voids, stock adjustments, and user changes each write an audit record (who / when / what)
      weight: 1
      traces: [NFR-16]
    - id: offline
      assert: with the network offline, the app loads and all features work on the LAN (no CDN/remote fonts/APIs at runtime)
      weight: 2
      traces: [NFR-17]
    - id: image-validation
      assert: product image uploads are validated server-side — png/jpeg/webp only, magic-byte checked, size-capped, path-safe; non-images/oversized rejected (400)
      weight: 2
      traces: [NFR-26]
