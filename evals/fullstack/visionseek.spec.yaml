# GENERATED by forge:requirements via 4-round interactive interview (no assumptions; user sign-off 2026-07-04).
# visionseek — local video moment search: upload video → llama.cpp VLM captions per shot → GGUF text-embedding
# search over captions → ranked moments (thumbnail + timestamp + caption), click seeks player. 100% local after
# one-time model download; fits 8GB NVIDIA VRAM. Solo user, localhost, accounts explicitly waived (confirmed).
# Weights from MoSCoW (Must=2, Should=1). SRS: forge/requirements-260704-2324/requirements.md
name: visionseek
summary: Local web app that finds moments in an uploaded video from an English text prompt — ffmpeg shot detection, llama.cpp VLM frame captions, GGUF caption embeddings, cosine-ranked moments with thumbnail/timestamp/caption, click-to-seek player; durable SQLite library with CRUD, history, export, settings, onboarding; fully offline after first-run model download on an 8GB NVIDIA GPU.
stack:
  language: python
  framework: fastapi
  inference: llama.cpp (managed llama-server subprocesses, OpenAI-compatible; settings can point to external server)
  models: Qwen2.5-VL-3B-Instruct Q4_K_M GGUF (+mmproj) for captions; nomic-embed-text-v1.5 GGUF for embeddings (both swappable)
  media: ffmpeg (shot detection, frame/thumbnail extraction, clip export)
  datastore: sqlite (embeddings as blobs, brute-force cosine; files on disk)
  frontend: server-rendered web UI at http://127.0.0.1:8321 (Stripe-style DESIGN.md)
  test: pytest + playwright (/browse e2e)
  deploy: local one-command start on Windows 11 (uv run), pinned lockfile
  auth: none — solo localhost tool, waived by user at sign-off (recorded decision, not assumption)

design:
  source: catalog
  ref: stripe

acceptance:
  logic:
    - id: l-shot-midpoint
      assert: shot [10.0s, 16.0s] -> representative frame timestamp = 13.0s, displayed "0:13"
      weight: 2
      gate: true
      traces: [FR-2, LV-1, R-2, R-6]
    - id: l-sampling-interval-branch
      assert: duration 1800s, shots detected 5 -> threshold max(8, ceil(1800/60))=30; 5 < 30 -> interval mode
      weight: 2
      gate: true
      traces: [FR-2, LV-2, R-1]
    - id: l-sampling-shot-branch
      assert: duration 1800s, shots detected 45 -> 45 >= 30 -> shot mode with exactly 45 frames
      weight: 2
      gate: true
      traces: [FR-2, LV-3, R-1]
    - id: l-interval-timestamps
      assert: duration 23s in interval mode -> frame timestamps exactly [2.5, 7.5, 12.5, 17.5, 21.5]
      weight: 2
      gate: true
      traces: [FR-2, LV-4, R-3]
    - id: l-clip-clamp-low
      assert: match t=3.0s, padding 5s, duration 60s -> clip bounds [0.0, 8.0]
      weight: 2
      gate: true
      traces: [FR-8, LV-5, R-5]
    - id: l-clip-clamp-high
      assert: match t=58.0s, padding 5s, duration 60s -> clip bounds [53.0, 60.0]
      weight: 2
      gate: true
      traces: [FR-8, LV-6, R-5]
    - id: l-ranking-tiebreak
      assert: query vec [1,0] vs frames A(t=30,[1,0]) B(t=40,[0.6,0.8]) C(t=10,[0.6,0.8]) D(t=5,[0,1]) -> order A(1.0), C(0.6), B(0.6), D(0.0) — cosine desc, tie broken by earlier timestamp
      weight: 2
      gate: true
      traces: [FR-4, LV-7, R-4]
    - id: l-topk-clamp
      assert: 30 indexed frames with K=50 -> 30 results; 300 frames with K=12 -> 12 results
      weight: 2
      gate: true
      traces: [FR-4, LV-8, R-4]
    - id: l-timestamp-display
      assert: t=754.0s -> displayed "12:34"
      weight: 2
      gate: true
      traces: [FR-4, LV-9, R-6]
    - id: l-e2e-scene-match
      assert: synthetic 3-scene fixture (0-8s red circle on white, 8-16s black text slide, 16-24s green grass) uploaded and indexed at temperature 0 -> query "red circle" top-1 timestamp in [0,8); query "green grass" top-1 timestamp in [16,24)
      weight: 2
      gate: true
      traces: [FR-1, FR-2, FR-4, LV-10, G-1]

  functional:
    - id: f-upload-to-ready
      assert: /browse e2e — drag fixture-3scene.mp4 onto library; card appears and status progresses queued->extracting->captioning->embedding->ready without page reload
      weight: 2
      traces: [FR-1, FR-2, FR-3, US-1]
    - id: f-upload-validation
      assert: /browse e2e — uploading a .exe renamed to .mp4 or a file >4GB is rejected with a clear inline error; library unchanged
      weight: 2
      traces: [FR-1, NFR-7]
    - id: f-index-progress-ui
      assert: /browse e2e — during indexing the video card shows live stage name + percent + ETA, updating without reload; app navigation stays responsive
      weight: 2
      traces: [FR-3]
    - id: f-search-results
      assert: /browse e2e — on the ready fixture video, prompt "red circle" returns ranked moments each showing thumbnail image, mm:ss timestamp, matched caption text, and score
      weight: 2
      traces: [FR-4, US-2]
    - id: f-click-seeks-player
      assert: /browse e2e — clicking a result seeks the inline player currentTime to the result timestamp within ±0.5s
      weight: 2
      traces: [FR-5, US-3]
    - id: f-rename-persists
      assert: /browse e2e — rename video via UI, reload page -> new name shown; survives server restart
      weight: 2
      traces: [FR-6, US-4]
    - id: f-delete-cascades
      assert: /browse e2e — delete video with confirmation -> gone from library; its media file, thumbnails, index rows, and search history are removed from disk/DB
      weight: 2
      traces: [FR-6, US-4]
    - id: f-reindex
      assert: /browse e2e — Re-index on a ready video cycles status back through the pipeline and returns ready with a fresh index (frame rows replaced)
      weight: 2
      traces: [FR-6, FR-2]
    - id: f-persist-across-restart
      assert: anti-demo — create video + run searches via UI, stop and restart the server process -> library entry, ready index, search history, and settings values all intact
      weight: 2
      traces: [FR-11, G-4]
    - id: f-fresh-install-empty
      assert: anti-demo — with models present and an empty data dir, first app start shows onboarding empty state with ZERO videos, zero history, no seeded records anywhere in the UI or DB
      weight: 2
      traces: [FR-10, G-4]
    - id: f-onboarding-model-download
      assert: /browse e2e — fresh install without models shows guided setup offering auto-download with progress bar and a manual local-GGUF-path alternative; app reaches ready_empty state after either path
      weight: 2
      traces: [FR-10, US-8]
    - id: f-search-history
      assert: /browse e2e — run two searches; history panel lists both with timestamps; clicking an entry re-runs it; individual delete removes one entry; survives reload
      weight: 1
      traces: [FR-7, US-5]
    - id: f-export-frame-png
      assert: /browse e2e — Export frame on a result downloads a PNG of the matched frame
      weight: 1
      traces: [FR-8, US-6]
    - id: f-export-clip-mp4
      assert: /browse e2e — Export clip on a result at t=3.0s of the 24s fixture with padding 5 downloads an mp4 whose duration matches clamped bounds [0.0, 8.0] ±0.2s
      weight: 1
      traces: [FR-8, LV-5, US-6]
    - id: f-settings-take-effect
      assert: /browse e2e — set top-K to 5 in settings -> next search returns exactly 5 results; change clip padding -> export honors it; values persist across restart
      weight: 2
      traces: [FR-9, US-7]
    - id: f-delete-all-data
      assert: /browse e2e — settings Delete-all-data with confirmation wipes library/history/index and returns the app to the onboarding empty state
      weight: 2
      traces: [FR-9, FR-10]
    - id: f-llama-crash-recovery
      assert: kill the managed llama-server subprocess -> /health reports degraded, app auto-restarts it, and the next search succeeds without manual intervention
      weight: 2
      traces: [FR-12]
    - id: f-failed-index-retry
      assert: /browse e2e — uploading a corrupt video file ends status=failed with a human-readable error on the card and a Retry action that re-queues the job
      weight: 2
      traces: [FR-3]

  ux:
    - id: u-design-conformance
      assert: live UI matches the Stripe-style DESIGN.md tokens — typography scale, color palette, spacing, button/input styles verified on library, video, search, settings, onboarding pages
      weight: 1
      traces: [NFR-4, design:stripe]
    - id: u-async-states
      assert: every async surface has designed states — library empty state, search zero-results state, indexing progress, model-download progress, and error states with recovery actions; no blank panes or raw spinners-forever
      weight: 2
      traces: [NFR-4, FR-3, FR-10]
    - id: u-axe-aa
      assert: axe scan on library, video/search, settings, onboarding pages -> 0 serious/critical violations; text contrast meets WCAG AA
      weight: 1
      traces: [NFR-4]
    - id: u-keyboard-nav
      assert: /browse e2e — search results are Tab-reachable; Enter on a focused result seeks the player; search input reachable and submittable by keyboard only
      weight: 1
      traces: [NFR-4, FR-5]
    - id: u-responsive-desktop
      assert: layout intact with no horizontal scroll or overlapping elements at 1920px and 1024px; usable (stacked, no clipped controls) at 768px
      weight: 1
      traces: [NFR-8]

  devops:
    - id: d-one-command-start
      assert: from a clean clone on Windows 11, the documented single command (uv run ...) boots the app serving the UI at http://127.0.0.1:8321 — including spawning managed llama-server when models are present
      weight: 2
      traces: [NFR-6, FR-12, G-3]
    - id: d-pinned-deps-readme
      assert: lockfile pins all Python deps + llama.cpp release version; README quickstart steps executed verbatim reach first-search successfully
      weight: 2
      traces: [NFR-6]
    - id: d-health-endpoint
      assert: GET /health returns 200 with JSON status for app, VLM server, embed server
      weight: 2
      traces: [NFR-5, NFR-6]
    - id: d-clean-shutdown
      assert: stopping the app terminates all managed llama-server child processes — no orphan llama processes remain (verified via process list before/after)
      weight: 2
      traces: [FR-12]
    - id: d-idempotent-reboot
      assert: hard-kill the app then start again -> boots cleanly, re-adopts or respawns llama-server, library intact, no port/lock errors
      weight: 2
      traces: [NFR-6, FR-11]

  monitoring:
    - id: m-health-detail
      assert: /health JSON includes per-model llama-server status (up/down, model name, endpoint), GPU name + VRAM info when available, and app version
      weight: 2
      traces: [NFR-5]
    - id: m-structured-index-telemetry
      assert: each indexing job emits structured logs with per-stage durations (extract, caption, embed) and per-frame caption latency; totals queryable via API or visible in UI job detail
      weight: 1
      traces: [NFR-5, NFR-1]
    - id: m-caption-throughput-slo
      assert: on the reference GPU, logged average per-frame caption latency <= 2.5s for the fixture video — the measured proxy for "30-min 1080p video indexes in <=10 min"
      weight: 2
      traces: [NFR-1]
    - id: m-error-logging
      assert: a failed indexing job logs a structured error record with video id, stage, and exception detail sufficient to diagnose without a debugger
      weight: 1
      traces: [NFR-5, FR-3]

  hardening:
    - id: h-localhost-bind
      assert: SECURITY — default server binds 127.0.0.1 only; connection attempts from another LAN host are refused unless the user explicitly opts into 0.0.0.0 in settings/config
      weight: 2
      traces: [NFR-7, C-5]
    - id: h-upload-validation
      assert: SECURITY — uploads validated for extension+container type and size cap 4GB (oversize -> 413 with message); non-video content rejected before processing
      weight: 2
      traces: [NFR-7, FR-1]
    - id: h-path-traversal
      assert: SECURITY — crafted filenames (../../x, absolute paths, reserved names) are sanitized on upload; media/thumbnail/export file APIs refuse any path resolving outside the storage dir (404/400, no disclosure)
      weight: 2
      traces: [NFR-7]
    - id: h-no-secrets-parameterized-sql
      assert: SECURITY — repo scan finds no hardcoded secrets/tokens; all SQL goes through parameterized queries/ORM (no string-built SQL anywhere)
      weight: 2
      traces: [NFR-7]
    - id: h-security-headers
      assert: SECURITY — responses carry CSP (no unsafe-eval; frame-ancestors via header), X-Content-Type-Options nosniff, and sane Referrer-Policy even as a local app
      weight: 1
      traces: [NFR-7]
    - id: h-offline-guarantee
      assert: PRIVACY — with GGUFs present and outbound network blocked, upload+index+search+export all succeed; network capture during those flows shows zero external requests (only first-run model download may touch the network)
      weight: 2
      traces: [NFR-3, G-2]
    - id: h-search-latency-slo
      assert: PERFORMANCE — p95 search latency <= 2s over >=20 sequential UI searches on the indexed fixture video
      weight: 2
      traces: [NFR-2]
    - id: h-library-scalability
      assert: PERFORMANCE — library list is paginated or virtualized (no unbounded render), thumbnails lazy-load, and video page avoids N+1 queries (frame rows fetched in one query)
      weight: 1
      traces: [NFR-2, NFR-7]
