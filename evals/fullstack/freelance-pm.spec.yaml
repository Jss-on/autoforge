# GENERATED by forge:requirements via 2-round interactive interview (no assumptions; user sign-off 2026-06-30).
# Solo freelance project-management system. Self-hosted single Docker container. Next.js + SQLite + Prisma.
# Weights from MoSCoW (Must=2, Should/Could=1). Logic = progress %, overdue/stalled, time→billable, recurrence, redaction.
# SRS: forge/requirements-260630-0119/requirements.md
name: freelance-pm
summary: Single-operator project-management tool for a solo freelancer running 3 concurrent client contracts — per-client Kanban boards, unified "My Work" view, milestones/timeline, progress + overdue/stalled flags, client status reports, built-in time tracking with per-project billable totals (CSV export), read-only client share links (time/money/notes redacted), recurring task templates, one-way GitHub/GitLab issue import, any-file attachments; owner login + share tokens; SQLite, self-hosted Docker.
stack:
  language: typescript
  framework: nextjs
  rendering: server + client (app router)
  datastore: sqlite (file on a persistent volume)
  orm: prisma
  auth: owner email-password session + per-project unguessable read-only share tokens
  files: local uploads volume (any file type; type allowlist + size cap; stored outside web root)
  test: vitest + testing-library + playwright
  api: REST + CSV export
  integrations: one-way GitHub/GitLab issue import (read-only)
  deploy: single docker container (app + SQLite volume + uploads volume), self-hosted

design:
  source: file
  ref: DESIGN1.md  # "Lumina" — playful-corporate, deep-purple #4A154B, Hanken Grotesk, 8px rhythm, pill buttons / 16px cards

acceptance:
  logic:
    - id: l-progress-count
      assert: project with 4 tasks, 1 done, no estimates -> progress = 25.00%
      weight: 2
      gate: true
      traces: [FR-11, NFR-19]
    - id: l-progress-empty
      assert: project with 0 tasks -> progress = 0.00% (no divide-by-zero; shows "no tasks")
      weight: 2
      gate: true
      traces: [FR-11, NFR-19]
    - id: l-progress-weighted
      assert: 3 tasks all estimated [done 2h, todo 3h, todo 5h] -> estimate-weighted progress = 20.00% (count-based would be 33.33)
      weight: 2
      gate: true
      traces: [FR-11, NFR-19]
    - id: l-progress-mixed
      assert: 4 tasks, 2 done, estimates on only some -> falls back to count-based = 50.00%
      weight: 2
      gate: true
      traces: [FR-11, NFR-19]
    - id: l-overdue-true
      assert: task due 2026-06-29, status in_progress, today 2026-06-30 -> overdue = true
      weight: 2
      gate: true
      traces: [FR-12, NFR-19]
    - id: l-overdue-future
      assert: task due 2026-07-01, status todo, today 2026-06-30 -> overdue = false
      weight: 2
      gate: true
      traces: [FR-12, NFR-19]
    - id: l-overdue-done
      assert: task due 2026-06-01, status done -> overdue = false (done never overdue)
      weight: 2
      gate: true
      traces: [FR-12, NFR-19]
    - id: l-stalled-true
      assert: in_progress task last updated 2026-06-23 (7 days), today 2026-06-30 -> stalled = true
      weight: 2
      gate: true
      traces: [FR-12, NFR-19]
    - id: l-stalled-false
      assert: in_progress task last updated 2026-06-25 (5 days) -> stalled = false
      weight: 2
      gate: true
      traces: [FR-12, NFR-19]
    - id: l-stalled-status
      assert: todo task last updated 2026-06-01 -> stalled = false (only in_progress can stall)
      weight: 2
      gate: true
      traces: [FR-12, NFR-19]
    - id: l-billable-basic
      assert: one entry 09:00->10:30 (90 min) at project rate 1500/h -> hours 1.50, billable = 2250.00
      weight: 2
      gate: true
      traces: [FR-16, FR-18, NFR-19]
    - id: l-billable-sum
      assert: entries 90 min + 15 min at rate 1200/h -> hours 1.75, billable = 2100.00
      weight: 2
      gate: true
      traces: [FR-16, FR-18, NFR-19]
    - id: l-billable-rounding
      assert: one entry 140 min (2h20m) at rate 1000/h -> hours 2.3333, billable = 2333.33 (half-up 2dp)
      weight: 2
      gate: true
      traces: [FR-16, FR-18, NFR-19]
    - id: l-billable-norate
      assert: entries summing 3h on a rate-0 (hours-only) project -> hours 3.00, billable = 0.00
      weight: 2
      gate: true
      traces: [FR-16, FR-18, NFR-19]
    - id: l-recurrence-weekly
      assert: weekly template anchored 2026-06-30 -> next instance date = 2026-07-07
      weight: 1
      gate: true
      traces: [FR-21, NFR-19]
    - id: l-recurrence-monthly-clamp
      assert: monthly template anchored 2026-01-31 -> next instance date = 2026-02-28 (clamp to month end)
      weight: 1
      gate: true
      traces: [FR-21, NFR-19]
    - id: l-recurrence-daily
      assert: daily template anchored 2026-06-30 -> next instance date = 2026-07-01
      weight: 1
      gate: true
      traces: [FR-21, NFR-19]
    - id: l-redaction-valid
      assert: GET /share/:token (valid) payload contains progress + milestones + shipped-log and NO timeEntries/rate/billable/notes keys anywhere
      weight: 2
      gate: true
      traces: [FR-19, NFR-9, NFR-19]
    - id: l-redaction-revoked
      assert: GET /share/:token (revoked) returns 404/410 with no project data
      weight: 2
      gate: true
      traces: [FR-20, NFR-9, NFR-19]
    - id: l-e2e-canon
      assert: project rate 1500, 4 tasks (1 done, no estimates), time entries 90min + 150min -> progress 25.00%, total hours 4.00, billable 6000.00, shipped-log lists the 1 done task
      weight: 2
      gate: true
      traces: [FR-1, FR-11, FR-15, FR-16, FR-18, NFR-19]
