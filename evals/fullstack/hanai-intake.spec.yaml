# Weights from MoSCoW (Must=2, Should=1). The request state machine is the ONE hand-rolled piece of
# domain logic — everything else adopts a battle-tested package. Gated golden rows come first.
name: hanai-intake
summary: hanai — a public client build-request portal. A stranger describes the software they want, uploads confidential context files, and submits; the operator triages in a private MFA-protected dashboard, asks alignment questions, and emails back versioned "snapshots" (inline screenshots + preview link + summary) and collects feedback. Nine-status state machine with a rework loop, passwordless client auth, quarantine-then-verify direct-to-storage uploads, a durable email outbox, and a one-click ZIP export that feeds AutoForge.

stack:
  language: typescript
  framework: nextjs@16 (app router, react 19.2, turbopack)
  rendering: server components + client islands for the form and uploader
  datastore: postgres (neon)
  orm: prisma@6.16
  validation: zod at every boundary (routes, server actions, webhooks, env)
  auth: client = passwordless magic link (jose sessions) · operator = email + argon2 password + otplib TOTP + recovery codes
  storage: vercel blob via a swappable storage adapter (s3/r2 later); client-direct upload, server never proxies bytes
  email: resend + react-email, durable postgres outbox + cron drain + signature-verified delivery webhooks
  botgate: cloudflare turnstile (verified server-side) + postgres sliding-window rate limits
  test: vitest + playwright + @axe-core/playwright
  deploy: vercel + neon, migrations in CI

design:
  source: file
  ref: autoresearch/requirements-260817-0022/DESIGN.md   # "Craft-Tech Minimalist", corrected at sign-off
  notes: >
    Eight client-approved Stitch screens and the logo set live in hanai_design/ — treat them as the
    visual ground truth. Base #0b1326, cards #161f32, borders #252e42, accent #39ff14 for STATE ONLY,
    0px corners, no shadows, Space Grotesk headings / Inter body / JetBrains Mono labels.
    The mockups' placeholder copy is NOT authoritative: the dropzone says "Max 10MB" (real cap 25MB),
    the mobile screen shows invented fields, the snapshot email addresses "Operator," (addresses the
    client), and the landing wordmark carries a template-leak artifact. Correct all four.

