    - id: h-quarantine-before-visible
      assert: "SECURITY: an uploaded object is not visible, listable or downloadable until magic-byte verification passes; a failed verification deletes the object"
      weight: 2
      traces: [FR-12]
    - id: h-svg-never-inline
      assert: "SECURITY: SVG is served only with Content-Disposition: attachment and is never inlined, so an embedded script cannot execute in the app origin"
      weight: 2
      traces: [FR-13]
    - id: h-csp-strict
      assert: "SECURITY: CSP script-src permits only 'self' and challenges.cloudflare.com; NO analytics or error-tracking script loads on any client-facing page; frame-ancestors is set as an HTTP header, never in a meta tag"
      weight: 2
      traces: [NFR-9]
    - id: h-security-headers
      assert: "SECURITY: HSTS, X-Content-Type-Options: nosniff, Referrer-Policy and Permissions-Policy are present on every response"
      weight: 2
      traces: [NFR-10]
    - id: h-zod-every-boundary
      assert: "SECURITY: every route handler, server action, webhook and env read validates through zod; no untyped request body reaches business logic"
      weight: 2
      traces: [NFR-12]
    - id: h-webhook-signature
      assert: "SECURITY: the resend webhook verifies its signature and rejects unsigned or replayed payloads"
      weight: 2
      traces: [FR-49]
    - id: h-no-secrets-in-repo
      assert: "SECURITY: no API key, database URL, session secret or blob token appears in the repository or in client bundles; a secret scan over the tree is clean"
      weight: 2
      traces: [NFR-13]
    - id: h-rate-limits-enforced
      assert: "SECURITY: 5 draft-creates per IP/hour, 60 upload authorizations per draft/hour, 10 magic links per email/hour and 100 authenticated writes per session/hour each return 429 with Retry-After at the boundary"
      weight: 2
      traces: [NFR-14]
    - id: h-ssrf-preview-url
      assert: "SECURITY: the snapshot preview URL is never fetched server-side, and only an https scheme is accepted, so it is neither an SSRF vector nor stored XSS"
      weight: 2
      traces: [FR-37]
    - id: h-session-hardening
      assert: "SECURITY: session cookies are httpOnly + secure + sameSite; client sessions expire at 30 days rolling and are revocable; operator sessions expire at 12h idle / 7d absolute"
      weight: 2
      traces: [FR-17, FR-28]
    - id: h-mfa-not-bypassable
      assert: "SECURITY: no operator flow reaches an authenticated session without TOTP or a valid single-use recovery code — password reset included"
      weight: 2
      traces: [FR-28, FR-29]
    - id: h-password-hashing
      assert: "SECURITY: operator passwords are hashed with argon2id; no plaintext or reversible storage anywhere"
      weight: 2
      traces: [FR-28]
    - id: h-snapshot-image-scope
      assert: "SECURITY: public-read applies ONLY to snapshot images at unguessable 128-bit paths that are never listed; every client upload remains private behind a short-lived signed URL"
      weight: 2
      traces: [FR-40, FR-14]
    - id: h-purge-deletes-bytes
      assert: "SECURITY: draft purge and an honoured deletion request remove stored objects as well as database rows, leaving an audit record of what was erased"
      weight: 2
      traces: [FR-56, FR-57]
    # ---- performance layer ----
    - id: h-perf-no-n-plus-1
      assert: "PERFORMANCE: the dashboard list, request detail and file gallery issue a bounded number of queries independent of row count — no N+1"
      weight: 2
      traces: [NFR-15]
    - id: h-perf-pagination-bounded
      assert: "PERFORMANCE: every list query carries a LIMIT; pagination is 25 with server-side filter and search; no endpoint can return an unbounded result set"
      weight: 2
      traces: [NFR-15]
    - id: h-perf-indexes
      assert: "PERFORMANCE: indexes exist for the actual access paths — request by client, by status, by reference, by last activity; file and snapshot by request id"
      weight: 2
      traces: [NFR-7, NFR-15]
