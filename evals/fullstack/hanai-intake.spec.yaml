  hardening:
    # ---- security layer ----
    - id: h-authz-per-resource
      assert: "SECURITY: every file, snapshot, thread message, note and export endpoint authorizes per request; a cross-client access attempt returns 404 (never 403) and issues no signed URL — swept for EVERY role pair, not just the happy path"
      weight: 2
