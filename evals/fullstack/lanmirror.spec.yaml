name: lanmirror
summary: LAN screen-mirroring web app — Android Chrome phone screen streamed P2P (WebRTC) to a desktop Chrome viewer with <100ms p95 glass-to-glass latency, QR+PIN pairing, quality modes, stats HUD; Hono+WS signaling, node:sqlite persistence, fully offline.
stack:
  language: typescript
  framework: vite-react-spa + hono-node-server (WebSocket signaling; WebRTC P2P media)
  datastore: node:sqlite (via createRequire; durable local DB)
design:
  source: catalog
  ref: linear

