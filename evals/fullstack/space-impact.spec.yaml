# autoresearch:build eval spec — declares what to build + per-dimension acceptance.
# Generated by autoresearch:requirements (260628-0141) from a signed-off SRS.
# Product: Nokia "Space Impact" arcade shooter as a client-only Next.js web game.
name: space-impact
summary: >-
  Browser remake of the Nokia "Space Impact" side-scrolling arcade shooter.
  Client-only Next.js (no backend): ship movement, shooting, multiple enemy
  types + waves, boss per level, power-ups, lives + escalating difficulty,
  per-device local high scores (arcade initials), SFX/music with mute, full
  keyboard + on-screen touch controls, responsive, installable PWA that plays
  offline. Public web players. Free, static deploy to Vercel.
stack:
  language: typescript
  runtime: browser
  framework: nextjs
  rendering: canvas
  frontend: react
  datastore: localstorage     # client-only; NO server, NO database
  pwa: true
  deploy: vercel-static
  test: vitest+playwright
design:
  source: generate            # catalog | file | url | generate
  ref: ""                     # build runs design-consultation -> writes DESIGN.md (retro arcade)

acceptance:
  functional:
    - id: builds
      assert: next build (static export) succeeds from a clean checkout
      weight: 1
    - id: boots
      assert: app serves and renders the start menu on localhost :3000
      weight: 1
    - id: ship-control
      assert: player ship moves within play-area bounds via keyboard and via touch
      weight: 2
    - id: shoot-collide
      assert: firing destroys enemies; projectile/enemy/ship collisions resolve with correct outcomes
      weight: 2
    - id: enemies-waves
      assert: at least 3 distinct enemy types spawn in waves with difficulty that ramps over time
      weight: 2
    - id: boss-levels
      assert: each of N fixed levels ends in a boss; defeating the final boss shows a win screen
      weight: 2
    - id: powerups
      assert: power-ups apply upgrades (e.g. spread/rapid fire, shield, extra life)
      weight: 2
    - id: lives-gameover
      assert: limited lives; losing all lives shows a game-over screen
      weight: 1
    - id: local-highscores
      assert: on game-over, 3-letter initials are entered; top-10 scores persist in localStorage and render
      weight: 2
    - id: tests-green
      assert: vitest unit suite passes, coverage >= 80
      weight: 1
  ux:
    - id: responsive
      assert: gameplay + menus work at 375px / 768px / 1280px
      weight: 2
    - id: touch-controls
      assert: on-screen d-pad + fire button are usable on a 375px viewport
      weight: 2
    - id: e2e-flow
      assert: /browse drives start -> play -> score -> game-over -> enter initials -> see local high score
      weight: 2
    - id: states
      assert: start / playing / paused / game-over / win screens all render
      weight: 1
    - id: a11y
      assert: axe scan via /browse reports zero serious/critical violations; menus keyboard-operable
      weight: 1
    - id: design-conformance
      assert: live computed styles match DESIGN.md tokens (palette, type, spacing); no off-system slop
      weight: 2
  devops:
    - id: build-static
      assert: next build produces a static export that needs no server runtime
      weight: 2
    - id: ci
      assert: CI runs lint + typecheck + test + build, all green
      weight: 1
    - id: deploy-vercel
      assert: documented one-command deploy to Vercel (or static host) succeeds
      weight: 2
    - id: pwa-installable
      assert: valid web app manifest + service worker; Lighthouse marks the app installable
      weight: 2
    - id: offline-play
      assert: with the network offline, the app loads from cache and is fully playable
      weight: 2
  monitoring:
    - id: fps-budget
      assert: gameplay sustains ~60fps (frame time <= ~16.7ms) over a sampled play session
      weight: 2
    - id: web-vitals
      assert: Lighthouse performance >= 90; LCP < 3s on a throttled cold load
      weight: 2
    - id: error-boundary
      assert: runtime errors are caught by an error boundary and surfaced, never a white screen
      weight: 1
    - id: no-console-errors
      assert: no console errors are emitted during a full playthrough
      weight: 1
  hardening:
    - id: no-secrets
      assert: no secrets in the shipped bundle; secret-scan is clean
      weight: 1
    - id: no-network-gameplay
      assert: gameplay issues zero network requests; everything runs client-side
      weight: 1
    - id: storage-safe
      assert: localStorage reads are validated/guarded; corrupt or oversized data cannot crash the game
      weight: 2
    - id: input-sanitize
      assert: initials input is bounded and sanitized (length + charset) before persist/render
      weight: 1
    - id: csp-headers
      assert: security headers / CSP are set via next config or host headers
      weight: 1
