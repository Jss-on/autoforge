      weight: 2
      traces: [NFR-H6, design:spacing]
    - id: ux-a11y
      assert: axe via /browse reports 0 serious/critical on the employee list, 201 record, onboarding wizard, and self-service profile
      weight: 2
      traces: [NFR-H6, design:color]
    - id: ux-design-conformance
      assert: live HR UI matches plugins/DESIGN.md "Modern Human Core" tokens (type scale, color, spacing, radius, motion) across admin + self-service
      weight: 2
      traces: [NFR-H7, design:type, design:color, design:spacing, design:radius, design:motion]
    - id: ux-onboarding-wizard
      assert: /browse drives the onboarding wizard end-to-end (steps, validation, completion) to a productive new hire
      weight: 2
