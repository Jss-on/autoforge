    - id: ux-org-chart
      assert: /browse renders the org chart from the reporting hierarchy and reflects a manager reassignment
      weight: 1
      traces: [HR-18, NFR-H6]
    - id: ux-states
      assert: loading / empty (no departments, no employees, no documents) / error states render on key HR screens
      weight: 1
      traces: [NFR-H6, design:states]
  devops:
    - id: dev-migrations
      assert: Prisma migrations for the new HR tables (Department, Position, Document, Dependent, Beneficiary, EmergencyContact, LeaveBalance, Attendance, OnboardingTask, HrSettings) apply cleanly to a fresh Postgres DB
      weight: 2
      traces: [NFR-H10]
    - id: dev-compose-volume
      assert: docker-compose mounts a persistent volume for 201-file document storage; app reads/writes uploads there; survives restart
      weight: 2
      traces: [NFR-H10, HR-6]
    - id: dev-ci
      assert: CI runs lint + test + build + dependency-scan green with the HR module added
      weight: 2
      traces: [NFR-H10]
    - id: dev-non-regression
      assert: the existing payroll suite (206 tests + 17 statutory golden vectors) still passes after the HR module; unchanged payroll inputs produce unchanged outputs
      weight: 2
      traces: [NFR-H12]
    - id: dev-env-validate
      assert: new env (file-storage path, invite-token secret) validated at startup; app fails fast with a clear message if missing
      weight: 1
      traces: [NFR-H10]
  monitoring:
    - id: mon-hr-audit
      assert: every HR mutation (CRUD, onboard, regularize, separate, document up/download, leave decision) writes an append-only audit entry (actor + tenant + timestamp)
      weight: 2
      traces: [NFR-H8]
    - id: mon-health-storage
      assert: /health checks DB + file-storage reachability; metrics cover HR routes
      weight: 2
      traces: [NFR-H9]
    - id: mon-structured-logs
      assert: structured request/error logs on HR routes; no PII (names, dependents, document contents) in log lines
      weight: 1
      traces: [NFR-H8, NFR-H9]
    - id: mon-error-boundary
      assert: React error boundary on HR routes; console clean during HR e2e flows
      weight: 1
      traces: [NFR-H9]
  hardening:
    - id: hard-self-only-authz
      assert: /browse an employee can read/write ONLY their own profile + own 201 documents; fetching another employee's record or document returns 403 (per-resource authZ, not just authentication)
      weight: 2
      traces: [NFR-H1, HR-15]
    - id: hard-manager-scope
      assert: a manager can act ONLY on their own direct reports' approvals/records; acting on a non-report returns 403
      weight: 2
      traces: [NFR-H1, HR-15]
    - id: hard-rls-newtables
      assert: Postgres RLS enforces tenant_id on every new HR table; cross-tenant access impossible even with forged ids
      weight: 2
      traces: [NFR-H1]
    - id: hard-pii-encryption
      assert: new sensitive PII (dependents, beneficiaries, emergency contacts) encrypted at rest via AES-256-GCM; raw DB columns show ciphertext
      weight: 2
      traces: [NFR-H2]
    - id: hard-file-upload-security
      assert: document upload validates MIME + extension + size, stores outside web root, blocks path traversal; download requires authZ
      weight: 2
      traces: [NFR-H3]
    - id: hard-input-validation
      assert: invalid HR input (bad date, CSV row, oversize file, malformed fields) rejected with inline error and not persisted
      weight: 2
      traces: [NFR-H4]
    - id: hard-xss-sqli-csrf
      assert: HR output escaped (no XSS); parameterized queries via Prisma (no SQLi); CSRF protection on HR mutations
      weight: 2
      traces: [NFR-H4]
    - id: hard-security-headers
      assert: CSP + security headers (nosniff, frame-ancestors) apply to HR routes incl. document download
      weight: 1
      traces: [NFR-H4]
    - id: perf-pagination
      assert: employee + document + department list endpoints are paginated with indexed sorts
      weight: 2
      traces: [NFR-H5]
    - id: perf-no-n1
      assert: org-tree / reporting-hierarchy resolution and list views avoid N+1; verified by query counts
      weight: 2
      traces: [NFR-H5]
    - id: perf-api-p95
      assert: HR API p95 latency < 300ms under nominal load
      weight: 1
      traces: [NFR-H5]
