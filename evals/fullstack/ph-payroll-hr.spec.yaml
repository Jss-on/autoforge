# GENERATED by forge:requirements via 3-round interactive interview (no assumptions; user sign-off 2026-06-30).
# HR module DEEP-INTEGRATED into existing build-output/ph-payroll-bureau. Downstream: forge:feature (delta + non-regression ratchet).
# Weights from MoSCoW (Must=2, Should=1). HR is the employee system-of-record; payroll reads it. Gated HR math first.
# SRS: forge/requirements-260630-1602/requirements.md
name: ph-payroll-hr
summary: HR system for the multi-tenant PH payroll bureau — org structure (departments/positions/manager hierarchy), rich 201-file records with real document upload, onboarding (HR/self-service/bulk), manual regularization, offboarding→final-pay, SIL leave accrual+balances+cash-conversion, tenure, benefits eligibility+allowance proration; HR is system-of-record read by payroll. Inherits Postgres RLS, MFA/RBAC, AES-256-GCM PII, audit, self-hosted Docker. Non-regression on the shipped payroll engine.
target: build-output/ph-payroll-bureau  # integrate into the existing app (feature, not greenfield)
stack:
  language: typescript
  framework: nextjs
  rendering: server + client (app router)
  datastore: postgres
  isolation: row-level security (tenant_id + RLS policies)
  orm: prisma
  auth: email-password + TOTP MFA (admins) + role-based access control + manager-routed approvals
  storage: local docker volume for 201-file document uploads (access-controlled)
  test: vitest + testing-library + playwright
  deploy: docker-compose (self-hosted, PH residency)

design:
  source: file
  ref: plugins/DESIGN.md  # "Modern Human Core" — inherited from the payroll app

acceptance:
  logic:
    - id: l-rate-313
      assert: monthly basic 30000, daily-rate factor 313 -> daily = 1150.16, hourly = 143.77
      weight: 2
      gate: true
      traces: [HR-12, HR-17, NFR-H11]
    - id: l-rate-261
      assert: monthly basic 30000, daily-rate factor 261 (configurable) -> daily = 1379.31
      weight: 2
      gate: true
      traces: [HR-17, NFR-H11]
    - id: l-sil-12mo
      assert: service 12 months -> SIL accrued = 5.00 days, eligible-to-use = true
      weight: 2
      gate: true
      traces: [HR-12, NFR-H11]
    - id: l-sil-6mo
      assert: service 6 months -> SIL accrued = 2.50 days, eligible-to-use = false (< 1 year)
      weight: 2
      gate: true
      traces: [HR-12, NFR-H11]
    - id: l-sil-balance
      assert: accrued 5.00 days, used 2 -> SIL balance = 3.00 days
      weight: 2
      gate: true
      traces: [HR-12, NFR-H11]
    - id: l-sil-carryover
      assert: prior-year 8 + new-year 5 = 13 with carryover cap 10 -> balance = 10.00 days
      weight: 2
      gate: true
      traces: [HR-12, HR-17, NFR-H11]
    - id: l-sil-conversion
      assert: 5 unused SIL days at daily(factor 313, monthly 30000)=1150.16 -> leave-to-cash = 5750.80
      weight: 2
      gate: true
      traces: [HR-12, HR-16, NFR-H11]
    - id: l-tenure-1
      assert: hired 2020-03-15, asOf 2025-06-30 -> tenure 5y 3m 15d, monthsOfService = 63
      weight: 2
      gate: true
      traces: [HR-14, NFR-H11]
    - id: l-tenure-2
      assert: hired 2025-01-01, asOf 2025-06-30 -> monthsOfService = 5, silEligible = false
      weight: 2
      gate: true
      traces: [HR-14, NFR-H11]
    - id: l-benefit-eligible
      assert: service 14 months + status regular -> silEligible = true, benefitEligible = true
      weight: 2
      gate: true
      traces: [HR-14, NFR-H11]
    - id: l-benefit-ineligible
      assert: service 8 months + status probationary -> silEligible = false, benefitEligible = false
      weight: 2
      gate: true
      traces: [HR-14, NFR-H11]
    - id: l-allowance-prorate
      assert: monthly allowance 3000, daysWorked 20, standardDays 22 -> prorated allowance = 2727.27
      weight: 2
      gate: true
      traces: [HR-14, NFR-H11]
    - id: l-e2e-finalpay
      assert: separated regular employee monthly 30000, factor 313, 5 unused SIL -> HR leave-to-cash 5750.80 flows into payroll final pay; other final-pay components unchanged
      weight: 2
      gate: true
      traces: [HR-16, HR-11, NFR-H11, NFR-H12]
  functional:
    - id: f-org-structure
      assert: /browse HR admin creates a department + position + assigns a reporting manager; org chart renders the hierarchy; cycles rejected; persists in DB
      weight: 2
      traces: [HR-1, HR-2, HR-3, HR-18]
    - id: f-employee-master
      assert: /browse HR admin creates/edits a 201 record (employmentType, status, dates, dept/position/manager, dependents, beneficiaries, emergency contacts); DB shows the row; dependents/contacts stored as ciphertext (encrypted at rest)
      weight: 2
      traces: [HR-4, HR-5]
    - id: f-documents-upload
      assert: /browse HR admin uploads a document to an employee 201 file; file stored on the volume + metadata row; download returns the bytes; invalid type/oversize rejected
      weight: 2
      traces: [HR-6]
    - id: f-onboarding-admin
      assert: /browse HR admin onboards a new hire with an onboarding checklist (tasks created, completable); new hire becomes active
      weight: 2
      traces: [HR-7]
    - id: f-onboarding-invite
      assert: /browse self-service invite issues a token link; new hire completes own profile + uploads docs; HR activates; DB reflects the completed profile
      weight: 2
      traces: [HR-8]
    - id: f-onboarding-bulk
      assert: /browse HR admin bulk-imports employees via CSV into an empty tenant; valid rows persist, invalid rows rejected with field errors
      weight: 1
      traces: [HR-9]
    - id: f-regularization
      assert: /browse HR manually regularizes a probationary employee; status flips to regular and regularizedOn is recorded; DB-confirmed
      weight: 2
      traces: [HR-10]
    - id: f-offboarding
      assert: /browse HR offboards an employee (separation date/reason + clearance checklist); account deactivated; existing payroll final-pay is triggered
      weight: 2
      traces: [HR-11]
    - id: f-leave-accrual
      assert: /browse employee SIL balance reflects monthly accrual; employee requests leave; manager approves; balance decremented; DB-confirmed
      weight: 2
      traces: [HR-12, HR-15]
    - id: f-attendance-record
      assert: /browse HR records attendance (tardy/undertime/absence) for an employee; recorded + reported; NO automatic payroll deduction applied
      weight: 1
      traces: [HR-13]
    - id: f-manager-approval
      assert: /browse a manager sees + decides only their own reports' leave/onboarding approvals; a non-manager employee cannot approve
      weight: 2
      traces: [HR-15, NFR-H1]
    - id: f-payroll-integration
      assert: /browse a payroll run reads the HR master — separated employees excluded, position pay grade feeds comp, leave balance feeds unpaid-leave/final-pay; DB-confirmed
      weight: 2
      traces: [HR-16]
    - id: f-hr-settings
      assert: /browse HR settings save + persist the daily-rate factor, leave carryover cap, document-type list, and onboarding-checklist template; a changed factor changes a recomputed daily rate
      weight: 2
      traces: [HR-17]
    - id: f-persistence-restart
      assert: HR data created in the UI (department, employee, document, onboarding task) survives an app restart (durable Postgres + volume), not in-memory
      weight: 2
      traces: [HR-19]
    - id: f-fresh-tenant-empty
      assert: a newly onboarded company starts with ZERO HR data (no departments/employees/documents) and builds its own; no demo HR seed leaks into a fresh tenant
      weight: 2
      traces: [HR-20]
  ux:
