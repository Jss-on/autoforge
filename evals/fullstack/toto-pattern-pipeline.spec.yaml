# SRS: forge/requirements-260821-1216/requirements.md · Weights: Must=2, Should=1.
# Reference hardware: RTX 3050 4GB laptop (8-core-class CPU, 16GB RAM). Prod model Toto-2.0-313m fp16; CI model Toto-2.0-4m (CPU).
name: toto-pattern-pipeline
summary: Python research pipeline + GPU inference sidecar — Binance BTCUSDT ingest/resample, causal Kalman, Toto-2.0 embedding extraction (forward hook), versioned HDBSCAN pattern alphabet with inductive assignment, occurrence stream, staged leg search (12h budget, checkpointed), FDR-controlled Metric Lab, portfolio assembly, deterministic fixture generator, gRPC EmbedAndAssign sidecar.
stack:
  language: python 3.12
  package_manager: uv (locked)
  data: polars + numpy + numba + pyarrow (parquet fp16 artifacts)
  ml: torch >=2.5 pinned, toto-models pinned (model revs pinned), hdbscan (scikit-learn-contrib — approximate_predict), scikit-learn (PCA/scaler), scipy (BCa bootstrap), arch (StationaryBootstrap)
  api: grpcio + protobuf (sidecar EmbedAndAssign), prometheus-client
  cli: typer + pydantic v2 configs + structlog + opentelemetry-sdk
  datastore: postgres 16 (sqlx-migrated shared schema in /deploy/migrations) + parquet artifact dir
  queue: postgres SKIP LOCKED worker (no redis/nats)
  test: pytest + hypothesis + pytest-benchmark
  layout: monorepo /pipeline + /sidecar (+ shared /deploy, /specs)

