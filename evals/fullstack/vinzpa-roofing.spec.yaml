# GENERATED by forge:requirements from a client brief (SRS in forge/requirements-260805-1350/).
# Brief: "build landing website for this company [VINZPA logo] and refer to this initial design
#         stitch_roofing_business_landing_page.zip and deploy in vercel"
# Elicitation: 5 rounds, client sign-off 2026-08-05. Weights from MoSCoW: Must=2, Should/Could=1.
# Client-confirmed opt-out from the real-product default: STATIC marketing site — no datastore,
# no accounts, no admin/CMS. The "wired-in" bar here is the quote route (must really reach a server
# route + mail client) and the content module (business facts must really be swappable).
name: vinzpa-roofing
summary: >
  Static multi-page marketing site for VINZPA Roofing Services and Trading, a Cagayan de Oro City
  roofing contractor + materials trader. 13 routes (home, services index + 4 service detail, gallery,
  about, contact/quote, faq, privacy, terms, 404). Three enquiry channels: click-to-call with a sticky
  mobile bar, Facebook Messenger, and a Turnstile-protected quote form emailed via Resend. Full local-SEO
  pack (meta/OG, sitemap, robots, LocalBusiness + Service + FAQPage JSON-LD). Industrial Integrity design
  system from the supplied Stitch export. Next.js 15 on Vercel. Placeholder content the owner swaps at handover.
stack:
  language: typescript
  runtime: node
  framework: next
  version: "15"
  router: app
  frontend: react
  styling: tailwind
  datastore: none
  auth: none
  email: resend
  captcha: cloudflare-turnstile
  hosting: vercel
  test: vitest+playwright

# Design reference adopted as the project's DESIGN.md — the client's own Stitch export.
design:
  source: file
  ref: forge/requirements-260805-1350/DESIGN.md
  brief: >
    "Industrial Integrity" — modern industrial + corporate minimalism derived from the VINZPA logo.
    Roofing Red #C4121A / #9A000D for action and accent, Deep Charcoal #1A1C1C for weight, Steel Gray
    #5F5E5E for secondary text, light #F9F9F9 canvas with #FFFFFF cards. Hanken Grotesk headlines
    (extra-bold, tight tracking), Work Sans body, JetBrains Mono uppercase labels/technical data.
    Soft 0.25rem radii only — no pills, no consumer-tech curves. 8px spacing rhythm, 1280px container,
    24px gutter, 48px between major sections. 1px-border cards, shadow only on hover. Light mode only.
    Reference layout: forge/requirements-260805-1350/design-reference.html + design-reference.png
    (hero with logo + dual CTA, bento services grid, charcoal CTA band, three-column footer).

acceptance:
  # ---------------------------------------------------------------------------
  # logic — golden vectors for PH mobile normalization + the quote payload contract.
  # No financial math in this domain; this is the one deterministic rule set. All gated.
  # ---------------------------------------------------------------------------
  logic:
    - id: mobile-local-11
      assert: 'validateMobile("09171234567") returns valid with normalized "+639171234567"'
      weight: 2
      gate: true
      traces: LG-1
    - id: mobile-e164-spaced
      assert: 'validateMobile("+63 917 123 4567") strips separators and returns valid "+639171234567"'
      weight: 2
      gate: true
      traces: LG-2
    - id: mobile-cc-no-plus
      assert: 'validateMobile("639171234567") returns valid "+639171234567"'
      weight: 2
      gate: true
      traces: LG-3
    - id: mobile-bare-10
      assert: 'validateMobile("9171234567") returns valid "+639171234567"'
      weight: 2
      gate: true
      traces: LG-4
    - id: mobile-too-short
      assert: 'validateMobile("0917-123-456") returns invalid with message "Enter a valid PH mobile number (e.g. 0917 123 4567)"'
      weight: 2
      gate: true
      traces: LG-5
    - id: mobile-bad-prefix
      assert: 'validateMobile("08171234567") returns invalid (subscriber number must start with 9), same message'
      weight: 2
      gate: true
      traces: LG-6
    - id: mobile-empty
      assert: 'validateMobile("") returns invalid with the same PH-mobile message (field is required)'
      weight: 2
      gate: true
      traces: LG-7
    - id: mobile-foreign
      assert: 'validateMobile("+1 415 555 0123") returns invalid (non-PH country code)'
      weight: 2
      gate: true
      traces: LG-8
    - id: service-enum-reject
      assert: 'POST /api/quote with service:"roofing" returns HTTP 400 and body {errors:{service:"Select a service"}}; mail client not called'
      weight: 2
      gate: true
      traces: LG-9
    - id: message-min-length
      assert: 'POST /api/quote with message:"leak" (4 chars) returns HTTP 400 and body {errors:{message:"Tell us a bit about the job (10 characters minimum)"}}'
      weight: 2
      gate: true
      traces: LG-10
    - id: turnstile-missing
      assert: 'POST /api/quote with a fully valid payload but no turnstileToken returns HTTP 403 and the mail client is NOT called'
      weight: 2
      gate: true
      traces: LG-11
    - id: quote-end-to-end
      assert: >
        POST /api/quote {name:"Juan Dela Cruz", mobile:"0917 123 4567", email:"juan@example.com",
        service:"repairs", city:"Cagayan de Oro City", message:"Leaking roof above the kitchen after the
        last typhoon."} with a valid token returns HTTP 200 {ok:true} and calls the Resend client EXACTLY
        ONCE with to = QUOTE_RECIPIENT_EMAIL, subject containing "Roof Repairs" and "Cagayan de Oro City",
        and a body containing "+639171234567" and "juan@example.com"
      weight: 2
      gate: true
      traces: LG-12
    - id: rate-limit-sixth
      assert: '6 POSTs to /api/quote from one IP inside the window: the 6th returns HTTP 429 and the mail client is called at most 5 times'
      weight: 1
      gate: true
      traces: LG-13

    # ---- ratcheted 2026-08-07: quotation builder feature (logic) ----
    - id: q-price-roofing
      assert: 'priceLine roofing: ₱285.00/m × 4.5 m × 12 → ₱15,390.00 exactly (integer centavos × millimetres / 1000)'
      weight: 2
      gate: true
      traces: 'FQ-1'
    - id: q-price-rounding
      assert: 'rounding is half-up once per line: ₱199.99/m × 3.33 m × 1 → ₱665.97'
      weight: 2
      gate: true
      traces: 'FQ-1'
    - id: q-accessory-fixed-length
      assert: 'accessory ₱450.00/pc × 3 → ₱1,350.00 with length FORCED to 2440 mm; a submitted length can never override it'
      weight: 2
      gate: true
      traces: 'FQ-2'
    - id: q-cross-grade-colour
      assert: 'a Premium-only colour is refused on Regular'
      weight: 2
      gate: true
      traces: 'FQ-3'
    - id: q-total-vat-inclusive
      assert: 'mixed quotation totals exactly and total === subtotal (VAT-inclusive, no separate VAT line)'
      weight: 2
      gate: true
      traces: 'FQ-4'
    - id: q-empty-order
      assert: 'an empty order is refused; every invalid line is reported with its index'
      weight: 2
      gate: true
      traces: 'FQ-5'
    - id: q-ref-format
      assert: 'quotation numbers are year-scoped and zero-padded (VZP-2026-0001), allocated in a transaction'
      weight: 2
      gate: true
      traces: 'FQ-6'
    - id: q-status-machine
      assert: 'NEW → CONTACTED → QUOTED → FOR_PAYMENT → WON; LOST from any non-terminal; WON/LOST terminal; no skipping or reversing'
      weight: 2
      gate: true
