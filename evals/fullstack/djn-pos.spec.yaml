# GENERATED by forge:requirements via 4-round interactive interview (no assumptions; user sign-off 2026-08-06).
# DJN Marketing — multi-branch PH hardware/construction-supply POS + inventory. Next.js + Postgres + Prisma, cloud.
# Weights from MoSCoW (Must=2, Should=1, Could=1). Priority: BIR/statutory correctness (gated golden oracle) first.
# SRS: forge/requirements-260806-2315/requirements.md
#
# CLIENT DECISION 2026-08-06 (SRS §2.1): Senior/PWD on hardware goods = 5% BNPC special discount per
# DTI-DA-DOE JAO 24-02 s.2024 — NO VAT exemption, cap P125 discount / P2500 purchases per calendar week,
# no carry-over. The 20%+VAT-exempt engine (RA 9994 s.4) is built but gated behind per-product
# sc_pwd_20_eligible, which no DJN product currently satisfies.
# CLIENT DECISION 2026-08-06 (SRS §2.2): document is an INVOICE (RA 11976 / RR 7-2024), not an Official Receipt.
# NOTE: the sales_pos wireframe's "$" and "Tax (8.5%)" are Stitch mock defaults — real is PHP and 12% VAT-inclusive.

name: djn-pos
summary: Multi-branch Philippine hardware-store POS for DJN Marketing — barcode checkout with 12% VAT-inclusive pricing, JAO 24-02 senior/PWD 5% BNPC discount with weekly cap, gapless BIR invoicing with non-resettable grand total and X/Z-readings, per-branch inventory with moving-average cost, purchasing/receiving, branch transfers, physical count, returns/credit notes, shifts with cash reconciliation, and consolidated multi-branch reporting.

stack:
  language: typescript
  framework: nextjs
  rendering: server + client (app router)
  datastore: postgres
  orm: prisma
  money: exact decimal (NUMERIC(14,2) / decimal.js) — never IEEE float, half-up to 2dp
  auth: email-password + optional TOTP MFA + role-based access control (Admin/Manager/Cashier) + branch scoping
  printing: ESC/POS thermal (58/80mm) with server-side PDF fallback
  test: vitest + testing-library + playwright
  deploy: docker-compose (app + postgres)
  locale: PHP (2dp half-up), Asia/Manila, DD/MM/YYYY, en

design:
  source: file
  ref: DESIGN.md  # "Industrial Utilitarian" — navy #001e40 / red #b52424 / Inter, from the DJN wireframe bundle

acceptance:

  # ---------------------------------------------------------------------------
  # LOGIC — golden oracle. Exact input -> exact output. gate:true = must-pass.
  # Every row derives from SRS §6.2 GV-1..GV-25 and is verified against the
  # statutory sources cited in SRS §Sources.
  # ---------------------------------------------------------------------------
  logic:
    - id: l-vat-plain
      assert: "GV-1 cart 10x cement @280.00 + 5x rebar @210.00 = gross 3850.00 VAT-inclusive -> VATable base 3437.50, VAT 412.50, total due 3850.00; cash tendered 5000.00 -> change 1150.00"
      weight: 2
      gate: true
      traces: [FR-26, FR-30, NFR-15]

    - id: l-scpwd-bnpc-under-cap
      assert: "GV-2 senior with fresh booklet buys 5x cement @280.00 = 1400.00 (bnpc_eligible) -> eligible 1400.00, discount 70.00 (5%), net payable 1330.00, base 1187.50, VAT 142.50 (NO VAT exemption); booklet ledger after = purchases 1400.00/2500.00, discount 70.00/125.00"
      weight: 2
      gate: true
      traces: [FR-27, NFR-15]

    - id: l-scpwd-bnpc-hits-cap
      assert: "GV-3 booklet already 2000.00 purchases / 100.00 discount this calendar week; buys 20x cement = 5600.00 -> remaining eligible 500.00, discount 25.00 (week total exactly 125.00 = cap), net payable 5575.00, base 4977.68, VAT 597.32; booklet after = 2500.00/2500.00 and 125.00/125.00"
      weight: 2
      gate: true
      traces: [FR-27]

    - id: l-scpwd-mixed-cart
      assert: "GV-4 senior cart = 3x cement 840.00 (bnpc_eligible) + 1x DeWalt drill 7500.00 (NOT bnpc_eligible), fresh week -> discount applies to 840.00 only = 42.00, drill undiscounted, net payable 8298.00, base 7408.93, VAT 889.07"
      weight: 2
      gate: true
      traces: [FR-27]

    - id: l-scpwd-20pct-refused
      assert: "GV-5 attempt to apply the 20%+VAT-exempt regime to 5x cement -> REJECTED with SC_PWD_20_NOT_APPLICABLE (construction materials are not enumerated under RA 9994 s.4); falls back to the 5% BNPC path yielding discount 70.00 / payable 1330.00 / VAT 142.50"
      weight: 2
      gate: true
      traces: [FR-27]

    - id: l-scpwd-no-carryover
      assert: "GV-6 booklet already at 2500.00/125.00 this calendar week; buys 5x cement 1400.00 -> discount 0.00, net payable 1400.00, base 1250.00, VAT 150.00; unused prior-week allowance is NOT carried over"
      weight: 2
      gate: true
      traces: [FR-27]

    - id: l-moving-avg-cost
      assert: "GV-7 on hand 100 @ avg 250.00 (value 25000.00), receive 50 @ 280.00 (14000.00) -> qty 150, value 39000.00, new moving-average cost 260.0000"
      weight: 1
      gate: true
      traces: [FR-23, FR-49]

    - id: l-cogs-margin-net-of-vat
      assert: "GV-8 after l-moving-avg-cost, sell 10x cement at retail 320.00 VAT-inclusive -> gross revenue 3200.00, net-of-VAT revenue 2857.14, COGS 2600.00, gross margin 257.14 (margin MUST use net-of-VAT revenue, never the VAT-inclusive amount); remaining stock 140 @ 260.0000 = 36400.00"
      weight: 1
      gate: true
      traces: [FR-23, FR-54]

    - id: l-uom-conversion
      assert: "GV-9 line = 2x box (1 box = 100 pc @ 220.00) + 30x pc @ 2.50 of HW-WS-2, opening stock 1200 pc -> line total 515.00, base 459.82, VAT 55.18, base-UoM deduction 230 pc, remaining 970 pc"
      weight: 1
      gate: false
      traces: [FR-17, FR-18]

    - id: l-uom-divisible
      assert: "GV-10 2.5 m of GI wire @35.00/m (divisible UoM) -> line 87.50 and stock 100 m -> 97.5 m; then 2.5x cement (indivisible UoM) -> REJECTED with UOM_NOT_DIVISIBLE"
      weight: 1
      gate: false
      traces: [FR-17]

    - id: l-discount-role-cap
      assert: "GV-11 cashier applies 8% line discount against a 5% role cap -> REJECTED with DISCOUNT_EXCEEDS_ROLE_CAP requiring override; on manager approval the discount applies AND an audit row records approver id, reason and before->after values"
      weight: 2
      gate: true
      traces: [FR-5, FR-11, FR-28, FR-6]

    - id: l-buyer-tin-threshold
      assert: "GV-12 sale of 3850.00 to a VAT-registered buyer with no TIN -> finalize BLOCKED with BUYER_TIN_REQUIRED (RR 7-2024, >=1000 threshold); a walk-in sale of 850.00 finalizes with no buyer details required"
      weight: 2
      gate: true
      traces: [FR-34]

    - id: l-void-reverses
      assert: "GV-13 invoice 3850.00 voided same business day pre-Z -> status VOIDED and invoice RETAINED (never deleted), stock restored +10 cement/+5 rebar, COGS reversed, net sales -3850.00, void tally incremented, and the accumulated grand total is UNCHANGED"
      weight: 2
      gate: true
      traces: [FR-38, FR-44]

    - id: l-credit-note-vat
      assert: "GV-14 credit note against a 3850.00 invoice returning 4x cement = 1120.00 restocked at avg cost 260.00 -> CN amount 1120.00, base 1000.00, VAT reversed 120.00, stock +4, inventory value +1040.00, COGS reversed 1040.00, invoice net after 2730.00, CN carries its own gapless serial series"
      weight: 1
      gate: true
      traces: [FR-39]

    - id: l-return-qty-guard
      assert: "GV-15 attempt to return 12x cement against an invoice where only 10 were sold -> REJECTED with RETURN_QTY_EXCEEDS_SOLD"
      weight: 1
      gate: true
      traces: [FR-39]

    - id: l-transfer-conserves-qty
      assert: "GV-16 branch A 150 / branch B 20, transfer 40 -> after dispatch A=110, in_transit=40, B=20, system total 170; after receipt A=110, in_transit=0, B=60, system total 170 (quantity conserved at every step, never double-counted or lost)"
      weight: 1
      gate: true
      traces: [FR-50]

    - id: l-count-variance
      assert: "GV-17 system qty 150 @ avg 260.00, counted 147, reason SHRINKAGE -> variance -3, adjustment posts qty -3 and value -780.00, requires manager approval, writes a COUNT_ADJUSTMENT stock movement plus an audit row"
      weight: 1
      gate: true
      traces: [FR-51, FR-19]

    - id: l-xread-no-reset
      assert: "GV-18 two X-readings mid-shift with sales 3850.00 then +1330.00 -> X1 running total 3850.00, X2 running total 5180.00; the reset counter and the accumulated grand total are UNCHANGED by X-reads, which may be run any number of times"
      weight: 2
      gate: true
      traces: [FR-42, FR-44]

    - id: l-zread-rollup
      assert: "GV-19 opening accumulated grand total 1234567.89 / reset counter 41 / last invoice 0004512; day = sales 3850.00 + 1330.00 + 8298.00, one void 1800.00, SC discounts 70.00 + 42.00 -> Z-read reports gross sales 13478.00, VATable base 12033.93, VAT 1444.07, SC/PWD discount total 112.00, voids 1/1800.00, invoice range 0004513-0004516 (the voided invoice remains an issued document in the series, excluded from gross sales but not from the range), new accumulated grand total 1248045.89, reset counter 42"
      weight: 2
      gate: true
      traces: [FR-43, FR-44]

    - id: l-zread-once-per-day
      assert: "GV-20 a second Z-reading on the same terminal for the same business day -> REJECTED with Z_READ_ALREADY_PERFORMED; reset counter stays 42 and the accumulated grand total is unchanged"
      weight: 2
      gate: true
      traces: [FR-43]

    - id: l-grand-total-monotonic
      assert: "GV-21 after a void and a credit note are posted following the Z-read, the accumulated grand total remains 1248045.89 — it is non-resettable, >=10 digits, and monotonically non-decreasing; no code path decrements it (RR 11-2004)"
      weight: 2
      gate: true
      traces: [FR-44]

    - id: l-invoice-gapless
      assert: "GV-22 a finalize that fails mid-transaction (payment error) consumes NO invoice number and rolls back stock/COGS/grand-total; the next successful sale is invoice 0004516 — no gap, no duplicate, no orphaned stock movement"
      weight: 2
      gate: true
      traces: [FR-31, NFR-15]

    - id: l-wholesale-tier
      assert: "GV-23 product with wholesale threshold 20, retail 280.00, wholesale 260.00; buying 25x cement -> unit price 260.00, line 6500.00, base 5803.57, VAT 696.43"
      weight: 1
      gate: false
      traces: [FR-29]

    - id: l-branch-scope-authz
      assert: "GV-24 a Cashier of branch B requesting branch A's sale, stock level and Z-reading by direct API id receives 403 on all three with no record data in the response body"
      weight: 2
      gate: true
      traces: [FR-4, NFR-10]

    - id: l-end-to-end
      assert: "GV-25 E2E: receive PO 50x cement @280.00 into branch A (opening 100 @250.00) -> avg cost 260.0000; senior buys 5 bags -> discount 70.00, base 1187.50, VAT 142.50, payable 1330.00; stock 145; COGS 1300.00; invoice prints MIN/PTU/serial + VAT breakdown + SC block; Z-read includes the sale; BIR sales-book row = gross 1400.00, discount 70.00, VATable 1187.50, VAT 142.50, net 1330.00"
      weight: 2
      gate: true
      traces: [FR-23, FR-27, FR-32, FR-43, FR-46, FR-49]

  # ---------------------------------------------------------------------------
  # FUNCTIONAL — every row is a live /browse e2e that drives the real UI.
  # Includes the anti-demo rows (persistence, fresh-empty, full CRUD).
  # ---------------------------------------------------------------------------
  functional:
    - id: f-persist-across-restart
      assert: "/browse ANTI-DEMO: create a product, a supplier and a finalized sale through the UI, restart the app and postgres containers, sign back in — all three records are still present with identical values (durable Postgres, no in-memory or seed-only path)"
      weight: 2
      traces: [FR-59]

    - id: f-fresh-account-empty
      assert: "/browse ANTI-DEMO: register a brand-new organisation, then open Products, Sales, Suppliers, Customers and Inventory — every list shows an empty state with a create CTA and zero rows; no pre-seeded demo data exists on any screen or API response"
      weight: 2
      traces: [FR-1, FR-60, FR-15]

    - id: f-product-crud
      assert: "/browse ANTI-DEMO CRUD: as Manager create a product (SKU, name, category, barcode, vat_status, bnpc_eligible, retail + wholesale price, min_level, base UoM), edit its price and min_level, then delete it — each step persists and is visible after a full page reload"
      weight: 2
      traces: [FR-16, FR-61]

    - id: f-onboarding-wizard
      assert: "/browse drive the first-run wizard end to end on a fresh account: create org -> first branch -> BIR/tax config (TIN, MIN, PTU, invoice series start) -> invite a user -> add first products incl. CSV import -> ring the first sale; afterwards the wizard does not reappear and the dashboard shows the real sale"
      weight: 2
      traces: [FR-14]

    - id: f-pos-checkout-flow
      assert: "/browse drive the real POS: scan/type a SKU into the search field, add lines, adjust qty with +/-, remove a line, press the discount action, process a cash payment with tendered amount, and land on a finalized invoice showing invoice number, VAT breakdown and change due"
      weight: 2
      traces: [FR-24, FR-30, FR-31, FR-32]

    - id: f-pos-barcode-scan
      assert: "/browse emit a barcode as keyboard-wedge input into the POS search field — the matching product is added to the cart as a line without any mouse interaction"
      weight: 2
      traces: [FR-22]

    - id: f-senior-discount-ui
      assert: "/browse in the POS, tag a sale as Senior/PWD, enter a booklet number, and confirm the UI shows the 5% BNPC discount applied to eligible lines only, the remaining weekly allowance, and a total that still includes VAT (no VAT exemption)"
      weight: 2
      traces: [FR-27]

    - id: f-invoice-print
      assert: "/browse finalize a sale and open the generated invoice — it is titled INVOICE (not Official Receipt), carries the BIR header block (registered name, TIN, business style, address, MIN, PTU, serial, accreditation), the four-bucket VAT breakdown, and the SC/PWD block when applicable; a reprint is watermarked REPRINT"
      weight: 2
      traces: [FR-32]

    - id: f-auth-signin-mfa
      assert: "/browse sign in with email and password, change the password from account settings and sign in again with the new one, then enrol TOTP MFA and complete a challenged sign-in; an invalid credential is rejected without revealing which field was wrong"
      weight: 2
      traces: [FR-2]

    - id: f-cash-drawer
      assert: "/browse completing a cash payment emits the drawer-kick command, and a no-sale drawer open from the POS is refused for a Cashier until a Manager approves, writing an audit row"
      weight: 1
      traces: [FR-35]

    - id: f-delivery-receipt
      assert: "/browse flag a sale for jobsite delivery with an address and driver, confirm a Delivery Receipt document is generated and stock leaves on dispatch, then mark the DR delivered and confirm the status updates"
      weight: 1
      traces: [FR-58]

    - id: f-transaction-history
      assert: "/browse open Transaction History, filter by date range and payment method, search a receipt id, page through results, and open an invoice detail — KPI tiles (total sales, transaction count, average ticket) reflect the filtered set and a voided row renders struck-through"
      weight: 2
      traces: [FR-36, FR-37, FR-40]

    - id: f-void-with-override
      assert: "/browse as Cashier attempt a void and be refused; sign in as Manager, approve with a reason, and confirm the invoice shows VOIDED, stock is restored on the inventory screen, and the audit log lists the approval"
      weight: 2
      traces: [FR-38, FR-5]

    - id: f-shift-open-xread-zread
      assert: "/browse open a shift with a beginning float, ring sales, run an X-reading, count the drawer by denomination at close, run the Z-reading, and view the Z-read report with invoice range, tender mix and reset counter"
      weight: 2
      traces: [FR-41, FR-42, FR-43, FR-45]

    - id: f-dashboard-live
      assert: "/browse with sales existing for today and yesterday, load the dashboard — total revenue, transaction count, the % delta vs yesterday, low-stock alerts against min_level, recent transactions and the quick actions all render live values from the database, not fixtures"
      weight: 2
      traces: [FR-52, FR-20]

    - id: f-inventory-screen
      assert: "/browse open Inventory Control, search by SKU and by name, filter by category and by Low Stock, page through server-side paginated results, and confirm In Stock / Low Stock status chips match each product's qty vs min_level"
      weight: 2
      traces: [FR-20, FR-21, FR-18]

    - id: f-branch-crud-and-settings
      assert: "/browse as Admin create a second branch, edit org settings (TIN, business style, address), set per-terminal BIR settings, role discount caps, receipt header/footer text and the org-default plus per-product low-stock thresholds, and change account profile settings incl. password — all persist, and the edited receipt header appears on the next printed invoice while the changed threshold re-drives the dashboard low-stock list"
      weight: 2
      traces: [FR-7, FR-8, FR-9, FR-10, FR-11, FR-12, FR-13, FR-61]

    - id: f-purchasing-receive
      assert: "/browse as Manager create a supplier, raise a purchase order, approve it, then post a PARTIAL goods receipt and a second receipt for the balance — PO status walks DRAFT->APPROVED->PARTIALLY_RECEIVED->RECEIVED and branch stock plus moving-average cost update on the inventory screen"
      weight: 1
      traces: [FR-47, FR-48, FR-49]

    - id: f-return-credit-note
      assert: "/browse issue a partial return against a finalized invoice with manager approval — a serially numbered credit note is produced, the returned quantity is restocked, and the invoice shows PARTIALLY_RETURNED"
      weight: 1
      traces: [FR-39]

    - id: f-branch-transfer
      assert: "/browse create a transfer from branch A to branch B, dispatch it, and confirm branch A stock drops with the quantity shown in transit; receive it at branch B and confirm branch B stock rises and in-transit clears"
      weight: 1
      traces: [FR-50]

    - id: f-physical-count
      assert: "/browse run a stock-count session for a category, enter counted quantities, review the system-vs-counted variance, approve as Manager, and confirm stock on hand and inventory valuation both change accordingly"
      weight: 1
      traces: [FR-51]

    - id: f-reports-and-exports
      assert: "/browse open reports and produce: sales analytics by branch/cashier/category/payment method, gross-margin at moving-average cost, inventory valuation, reorder list, and a BIR sales-book CSV export whose downloaded rows match the on-screen figures"
      weight: 1
      traces: [FR-46, FR-53, FR-54, FR-55]

    - id: f-quotation-to-sale
      assert: "/browse create a customer with TIN and address, build a quotation with a valid-until date, print it, then convert it to a sale in one action — the cart is pre-filled with the quoted lines and prices without re-keying"
      weight: 1
      traces: [FR-56, FR-57]

    - id: f-hold-resume-cart
      assert: "/browse hold an in-progress cart, start and finalize a second sale on the same terminal, then resume the held cart with its lines and discounts intact"
      weight: 1
      traces: [FR-25]

  # ---------------------------------------------------------------------------
  # UX
  # ---------------------------------------------------------------------------
  ux:
    - id: u-design-conformance-color
      assert: "/browse design-conformance: computed styles on every route match the DESIGN.md colour palette — primary #001e40, on-primary #ffffff, secondary #b52424, surface #f9f9fc, surface-container #eeeef0, on-surface #1a1c1e, on-surface-variant #43474f, outline-variant #c3c6d1, error #ba1a1a; no off-system ('slop') colour values appear anywhere in the rendered UI"
      weight: 2
      traces: [NFR-1, design:color]

    - id: u-design-conformance-type
      assert: "/browse design-conformance: rendered text matches the DESIGN.md Inter type ramp — display-lg 48/56 700 -0.02em, headline-lg 32/40 600, headline-md 24/32 600, headline-sm 20/28 600, body-lg 18/28 400, body-md 16/24 400, label-lg 14/20 600 0.01em, label-md 12/16 500, and headline-lg-mobile 28/36 600 below the tablet breakpoint"
      weight: 2
      traces: [NFR-1, design:type]

    - id: u-design-conformance-spacing-radius
      assert: "/browse design-conformance: layout uses the DESIGN.md 8px spacing base with 24px container padding, 16px gutter and stack-sm/md/lg 4/12/24px; radii are 4px default on inputs, buttons and table rows, 8px (rounded-lg) on large containers such as the checkout panel, and 9999px only on status chips"
      weight: 2
      traces: [NFR-1, design:spacing, design:radius]

    - id: u-design-conformance-motion-depth
      assert: "/browse design-conformance: depth is tonal, not heavy shadow — level-1 cards are flat white with a 1px #c3c6d1 border and NO shadow, while only dropdowns, modals and the sticky checkout summary carry the level-2 ambient shadow (blur 8px, y 4px, rgba(0,51,102,0.08)); transitions on those overlays and on button/input focus are consistent and respect prefers-reduced-motion"
      weight: 1
      traces: [NFR-1, design:motion]

    - id: u-component-states
      assert: "/browse every data surface implements all four component states from DESIGN.md — loading (skeleton/spinner), empty (message + create CTA), error (message + retry), success — verified on Products, Inventory, Transaction History, Reports and the POS cart; status chips render In Stock / Low Stock / Out of Stock and Cash / Card / GCash / Voided per the design system"
      weight: 2
      traces: [NFR-6, FR-15, design:states]

    - id: u-accessibility-aa
      assert: "/browse axe-core reports ZERO violations on every route (dashboard, POS, inventory, history, reports, settings, onboarding); all text clears 4.5:1 on every surface incl. muted text and status chips; focus rings are visible on all interactive elements"
      weight: 2
      traces: [NFR-2]

    - id: u-keyboard-first-pos
      assert: "/browse operate a full checkout using only the keyboard — Ctrl/Cmd-K focuses search, arrow keys and Enter add a product, D opens discount, Enter processes payment; no step requires a mouse"
      weight: 1
      traces: [FR-33, NFR-2]

    - id: u-touch-targets
      assert: "/browse measure interactive elements — POS keypad/payment buttons are >=64px tall per DESIGN.md and every other interactive target is >=44px"
      weight: 1
      traces: [NFR-3]

    - id: u-responsive-desktop-tablet
      assert: "/browse at 1920px, 1280px, 1024px (tablet landscape), 768px (tablet portrait) and 360px — the POS keeps the cart visible in landscape and moves it to a bottom sheet in portrait; no route scrolls the body horizontally at any width"
      weight: 2
      traces: [NFR-4]

    - id: u-destructive-confirmation
      assert: "/browse void, delete, post-adjustment and Z-read each raise an explicit confirmation naming the object being acted on, and cancelling leaves state unchanged"
      weight: 1
      traces: [NFR-5]

    - id: u-error-recovery
      assert: "/browse trigger a failed payment, a duplicate SKU and an out-of-stock line — each surfaces a human-readable message with a recovery path; no raw stack trace, bare 500 or unhandled error overlay reaches the user"
      weight: 1
      traces: [NFR-6]

  # ---------------------------------------------------------------------------
  # HARDENING — security layer + performance layer
  # ---------------------------------------------------------------------------
  hardening:
    - id: h-branch-scoping-idor
      assert: "SECURITY: per-resource authZ — a Cashier's session cannot read or mutate another branch's sales, stock, shifts, Z-readings or reports by direct object id; every such request returns 403 with no data. Verified per role across every API route (no route relies on client-side scoping)"
      weight: 2
      traces: [FR-4, NFR-10]

    - id: h-role-enforcement-serverside
      assert: "SECURITY: the role matrix is enforced server-side — a Cashier cannot Z-read, mutate products, post receipts/transfers/counts, or reach user/branch/tax settings via direct API call regardless of what the UI renders"
      weight: 2
      traces: [FR-3, NFR-10]

    - id: h-audit-append-only
      assert: "SECURITY: the audit log is append-only — no UI action or API route updates or deletes an audit row; price changes, stock adjustments, voids, returns, discounts, approvals, logins and settings changes each write actor, action, entity, before->after, timestamp and branch"
      weight: 2
      traces: [FR-6, NFR-20]

    - id: h-owasp-top10
      assert: "SECURITY: parameterised queries only (no string-built SQL), Zod schema validation at every API boundary, output encoding, CSRF protection, secure/httpOnly/sameSite session cookies, and rate limiting on auth and payment endpoints"
      weight: 2
      traces: [NFR-11]

    - id: h-no-secrets
      assert: "SECURITY: no hardcoded secrets anywhere in the repo; all credentials come from environment variables validated at boot; secrets never appear in logs, error responses or the client bundle"
      weight: 2
      traces: [NFR-12, NFR-26]

    - id: h-security-headers
      assert: "SECURITY: production responses carry a nonce-based CSP with no unsafe-eval, HSTS, X-Content-Type-Options, Referrer-Policy, and frame-ancestors set via HTTP header (not meta)"
      weight: 2
      traces: [NFR-13]

    - id: h-pii-tin-protection
      assert: "SECURITY: customer TIN, senior/PWD ID and booklet numbers never appear in application logs or client-side error reports, and are not returned to roles without permission to see them"
      weight: 2
      traces: [NFR-14]

    - id: h-decimal-money
      assert: "SECURITY/CORRECTNESS: all monetary and cost columns are exact decimal (NUMERIC(14,2), 4dp for unit cost) with a decimal library in application code — no IEEE float is used in any price, tax, discount, cost or total path; rounding is half-up to 2dp at line level"
      weight: 2
      traces: [NFR-15]

    - id: h-p95-latency
      assert: "PERFORMANCE: at 10 concurrent users with 2000 SKUs and 3 years of history seeded in the perf fixture — p95 add-to-cart < 150ms, product search < 200ms, checkout commit < 500ms, dashboard load < 1500ms"
      weight: 2
      traces: [NFR-7]

    - id: h-no-n-plus-1
      assert: "PERFORMANCE: no N+1 queries on cart, transaction history, inventory list or dashboard (query count is constant as row count grows); all list endpoints paginate server-side and product search is index-backed on SKU, name and barcode"
      weight: 2
      traces: [NFR-8]

    - id: h-core-web-vitals
      assert: "PERFORMANCE: POS and dashboard routes meet LCP < 2.5s, CLS < 0.1 and INP < 200ms"
      weight: 1
      traces: [NFR-9]

  # ---------------------------------------------------------------------------
  # MONITORING
  # ---------------------------------------------------------------------------
  monitoring:
    - id: m-structured-logs
      assert: "structured JSON logs carry request id, actor, branch, route, latency and status on every request, and contain no PII, TIN or booklet numbers"
      weight: 2
      traces: [NFR-16]

    - id: m-health-endpoint
      assert: "GET /api/health returns app and database status with a non-200 when postgres is unreachable"
      weight: 2
      traces: [NFR-17]

    - id: m-latency-metrics
      assert: "p50/p95/p99 latency and error rate are recorded per route and exposed for dashboarding"
      weight: 1
      traces: [NFR-18]

    - id: m-error-tracking
      assert: "unhandled exceptions are captured with stack, route and release, scrubbed of PII before transmission"
      weight: 1
      traces: [NFR-19]

    - id: m-audit-queryable
      assert: "/browse the admin audit screen filters the audit log by actor, entity, action and date range and returns matching rows"
      weight: 1
      traces: [NFR-20]

    - id: m-compliance-alerts
      assert: "alert rules fire on a failed Z-reading, an accumulated-grand-total anomaly (any non-increase across a sale), an invoice-sequence gap, error rate > 1%, and a p95 SLO breach"
      weight: 2
      traces: [NFR-21]

  # ---------------------------------------------------------------------------
  # DEVOPS
  # ---------------------------------------------------------------------------
  devops:
    - id: d-docker-compose-up
      assert: "from a clean checkout, docker compose up brings the app and postgres to a working state with no manual steps beyond copying .env.example"
      weight: 2
      traces: [NFR-22]

    - id: d-migrations
      assert: "prisma migrations are versioned and forward-only; migrate deploy runs cleanly against an empty database and against the previous release's schema; no destructive auto-sync path exists"
      weight: 2
      traces: [NFR-23]

    - id: d-ci-green
      assert: "CI runs typecheck, lint, unit, integration and e2e suites plus a production build, and fails the pipeline on any red step"
      weight: 2
      traces: [NFR-24]

    - id: d-coverage-and-goldens
      assert: "test coverage >= 80% AND 100% of the gated logic golden vectors in the logic block pass"
      weight: 2
      traces: [NFR-25]

    - id: d-env-validation
      assert: "the app validates required environment variables at boot and refuses to start with a clear message when misconfigured"
      weight: 2
      traces: [NFR-26]

    - id: d-backup-restore
      assert: "a documented backup and restore procedure exists and is exercised in CI — dump, drop, restore, and verify a known sale and its invoice number survive"
      weight: 1
      traces: [NFR-27]

    - id: d-seed-is-test-only
      assert: "seed scripts are test/fixture-only and are guarded against running against a production database; a production deploy creates no business data"
      weight: 2
      traces: [NFR-28, FR-60]

    - id: d-prod-build-parity
      assert: "acceptance runs against the PRODUCTION build (next build + next start), not the dev server, so dev-only tolerances cannot mask a production failure"
      weight: 2
      traces: [NFR-24]
