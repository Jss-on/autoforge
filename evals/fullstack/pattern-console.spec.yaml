# Spec 2 of 2 (shared monorepo /app; sibling: toto-pattern-pipeline.spec.yaml owns /pipeline + /sidecar).
# SRS: forge/requirements-260821-1216/requirements.md · Weights: Must=2, Should=1.
# Cross-language parity: logic goldens below are the SAME vectors the pipeline spec gates in Python.
name: pattern-console
summary: Rust web console (axum + tokio + sqlx + askama/htmx + ECharts) — live Binance WS ingest, causal Kalman, gRPC sidecar calls, realtime pattern dashboard with hard staleness rule, leg engine (matching/fills/time-stops), leg table + Metric Lab/cluster report viewers, next-pattern probabilities with n, run manager over a Postgres queue, viewer/admin auth, append-only audit; demoable GPU-free via fixture replayer.
stack:
  language: rust (stable)
  backend: axum + tokio + tower + sqlx (postgres 16, migrations) + tonic (gRPC client) + tokio-tungstenite (binance WS)
  frontend: askama templates + htmx (vendored) + ECharts (vendored) — no CDN, no Leptos
  auth: argon2id + tower-sessions (postgres store), roles viewer/admin
  validation: garde/validator equivalents on every param; rust_decimal for money math
  observability: tracing + tracing-opentelemetry + OTLP, metrics-exporter-prometheus
  queue: postgres SKIP LOCKED job rows (shared schema with pipeline workers)
  test: cargo test + proptest + playwright e2e (node devdep in /app/e2e) on the fixture replayer
  deploy: docker compose (postgres + sidecar + app; optional caddy TLS profile), monorepo /app

design:
  source: file
  ref: forge/requirements-260821-1216/design-brief.md  # "Terminal + cards" — operate mode, dense, dark-first, mono tabular numerals
  mode: operate
  dislikes: [pure Grafana/SaaS blue panel flavor, borderless flat terminal without card grouping, light-first chrome, probabilities shown without n, spinner-only loading states]

acceptance:
  logic:
    - id: l-gv1-resample-rs
      assert: rust resampler — 1m bars 12:00-12:04 (100,102,99,101,5),(101,103,100,102,3),(102,102,98,99,4),(99,101,97,100,2),(100,105,100,104,6) -> 5m@12:00 = (O=100,H=105,L=97,C=104,V=20,synthetic_count=0)
      weight: 2
      gate: true
      traces: [FR-1, GV-1]
    - id: l-gv2-gap-rs
      assert: rust resampler with 12:02 missing -> synthetic (102,102,102,102,0,true) and 5m (O=100,H=105,L=97,C=104,V=16,synthetic_count=1)
      weight: 2
      gate: true
      traces: [FR-1, GV-2]
    - id: l-gv3-costs-rs
      assert: rust margin math — (0,0) long 100->105.50 net +5.50 short 100->96 net +4.00 (net==gross); (10bp,0) nets +5.2945 / +3.804; (10bp,1bp) nets +5.27395 / +3.7844
      weight: 2
      gate: true
      traces: [FR-6, GV-3a, GV-3b, GV-3c, INV-5]
    - id: l-gv4-collapse-rs
      assert: rust run-length collapse — [3,3,3,7,7,-1,7,2,2] -> occurrences [3,7,7,2]
      weight: 2
      gate: true
      traces: [FR-5, GV-4]
    - id: l-gv5-matcher-rs
      assert: rust live matcher — occurrences [1,2,5]: (2->5) fires at the 5; [2,4,5]: no fire; (5) fires on any 5; [7,7]: (7->7) fires at second 7 (repeats allowed)
      weight: 2
      gate: true
      traces: [FR-6, GV-5]
    - id: l-gv6-gv12-transitions-rs
      assert: transitions with n — [1,2,1,2,3]: k=1 gives P(2|1)=1.0 n=2, P(1|2)=0.5 n=2, P(3|2)=0.5 n=2; k=2 gives P(1|[1,2])=0.5 n=2, P(3|[1,2])=0.5 n=2, P(2|[2,1])=1.0 n=1
      weight: 2
      gate: true
      traces: [FR-9, GV-6, GV-12]
    - id: l-gv9-timestop-rs
      assert: rust leg engine — max_hold=3, fill open(11)=100.0, no exit -> force close open(14)=103.0 net +3.00 exit_reason=time_stop; exit-signature precedence on the same boundary
      weight: 2
      gate: true
      traces: [FR-6, GV-9]
    - id: l-gv13-kalman-rs
      assert: rust causal KF q=0.01 r=1.0 x0=z0 P0=r on [100,101,99,102,100] -> [100.0000000000, 100.5024875622, 99.9933883754, 100.5123400204, 100.4038558976] within 1e-9 (parity with python)
      weight: 2
      gate: true
      traces: [FR-2, GV-13, KF-1]
    - id: l-gv15-one-position-rs
      assert: rust leg engine — entry (5), occurrences [5,5] while open -> second entry ignored, exactly 1 trade
      weight: 2
      gate: true
      traces: [FR-6, GV-15, INV-3]
    - id: l-p1-causality-rs
      assert: proptest — appending future bars never changes rust KF outputs at earlier timestamps
      weight: 2
      gate: true
      traces: [FR-2, P-1, KF-1]
