# GENERATED by forge:requirements from a client brief (SRS in forge/requirements-260628-1314/).
# Brief: "build website intended for Borj portfolio that shows his face"
# Weights from MoSCoW: Must=2, Should/Could=1.
name: borj-portfolio
summary: Bold/creative freelance-developer portfolio, face-forward hero. Case-study projects, inline+PDF CV, Resend contact form, Calendly booking, SEO/OG, analytics, dark/light. Next.js on Vercel. Realistic placeholders, owner swaps real content later.
stack:
  language: typescript
  runtime: node
  framework: next
  datastore: none
  frontend: react
  auth: none
  email: resend
  booking: calendly
  analytics: vercel
  test: vitest+playwright

# Design reference adopted as the project's DESIGN.md (chosen in elicitation: generate, bold).
design:
  source: generate
  ref: bold-gradient-display
  brief: >
    Bold, creative personal-brand aesthetic: large display typography, vivid
    multi-stop gradients, high contrast, generous whitespace, tasteful scroll/hover
    motion. Borj's face is the hero centerpiece, prominent above the fold.
    Dark default with a light toggle. Signals confident, modern technical taste.

acceptance:
  functional:
    - id: hero-face
      assert: home "/" renders a hero with Borj's face image (next/image, non-empty src + alt) plus name + tagline + a primary CTA button linking to contact or booking
      weight: 2
    - id: about-bio
      assert: an about/bio section renders biography copy and is reachable from nav
      weight: 2
    - id: projects-index
      assert: work "/work" lists project cards; each card links to its own case-study route
      weight: 2
    - id: case-study-page
      assert: each project page "/work/:slug" renders problem, solution, stack, and results sections
      weight: 2
    - id: cv-inline
      assert: resume section renders experience + skills inline
      weight: 2
    - id: cv-pdf
      assert: a "Download CV" link returns a PDF (HTTP 200, content-type application/pdf)
      weight: 1
    - id: contact-form
      assert: contact form POSTs to a server route that sends mail via Resend; valid submit shows a success state; invalid input shows inline validation errors
      weight: 2
    - id: booking-embed
      assert: booking section loads an embedded Calendly widget from NEXT_PUBLIC_CALENDLY_URL
      weight: 1
    - id: social-links
      assert: header/footer expose social + email links with valid resolvable hrefs (mailto + https)
      weight: 2
    - id: tests-green
      assert: vitest unit + playwright e2e pass; coverage >= 80
      weight: 1
  ux:
    - id: design-conformance
      assert: live UI matches the generated bold DESIGN.md tokens (display type scale, gradient palette, color vars) verified via /browse screenshot
      weight: 2
    - id: hero-face-visible
      assert: Borj's face image is visible above the fold on home at 1280 and 375 widths (the brief's core ask)
      weight: 2
    - id: responsive
      assert: home, work index, case-study, and contact render at 375/768/1280 with no horizontal overflow
      weight: 2
    - id: a11y
      assert: axe via /browse reports zero serious/critical issues on home, a case-study page, and contact
      weight: 2
    - id: dark-light
      assert: theme toggle switches dark/light and the choice persists across reload
      weight: 1
    - id: states
      assert: contact form loading/success/error states and projects loaded state render correctly
      weight: 1
  devops:
    - id: build-green
      assert: next build completes with no type errors and produces the production build
      weight: 2
    - id: ci
      assert: CI runs lint + test + build green on push
      weight: 2
    - id: env-config
      assert: .env.example documents RESEND_API_KEY + NEXT_PUBLIC_CALENDLY_URL (+ optional contact recipient); no secrets committed
      weight: 2
    - id: vercel-ready
      assert: project builds as a Vercel-deployable Next app; preview/prod deploy config present
      weight: 1
    - id: static-routes
      assert: build output shows marketing pages statically generated (SSG) where no server data is needed
      weight: 1
  monitoring:
    - id: analytics
      assert: Vercel Analytics (or Plausible) script loads on rendered pages
      weight: 1
    - id: perf-lighthouse
      assert: Lighthouse performance >= 90 on home
      weight: 2
    - id: a11y-score
      assert: Lighthouse accessibility >= 95 on home
      weight: 1
    - id: lcp
      assert: home LCP < 2.5s (hero image served via next/image, sized + priority)
      weight: 1
    - id: seo-meta
      assert: every page emits title + description meta and an og:image; og:image URL resolves (HTTP 200)
      weight: 1
    - id: form-observability
      assert: contact route logs send success/failure server-side (no PII in logs beyond what's required)
      weight: 1
  hardening:
    - id: form-validation
      assert: contact server route validates name/email/message and rejects malformed input with 400
      weight: 2
    - id: spam-protection
      assert: contact form has a honeypot or captcha; obvious bot submissions are rejected
      weight: 2
    - id: secret-safety
      assert: RESEND_API_KEY is server-side only and never present in the client bundle; secret-scan clean
      weight: 2
    - id: security-headers
      assert: responses set CSP, X-Content-Type-Options, and Referrer-Policy via Next headers config
      weight: 1
    - id: rate-limit
      assert: contact endpoint is rate-limited and returns 429 past threshold
      weight: 1
    - id: no-secrets
      assert: no hardcoded secrets anywhere; .env.example present and complete
      weight: 1
