# GENERATED by autoresearch:requirements from a client brief (SRS in run dir).
# Weights from MoSCoW: Must=2, Should=1.
name: expense-tracker
summary: Internal expense submission/approval/export with SSO, audit, GDPR, k8s.
stack:
  language: typescript
  runtime: node
  framework: fastify
  datastore: postgres
  frontend: react
  auth: oidc
  test: vitest

acceptance:
  functional:
    - id: submit-expense
      assert: POST /expenses with receipt returns 201, status=submitted, receipt retrievable
      weight: 2
    - id: list-own
      assert: GET /expenses returns only the caller's expenses with status
      weight: 1
    - id: approve-reject
      assert: manager PATCH /expenses/:id transitions submitted->approved/rejected; illegal transitions 409
      weight: 2
    - id: csv-export
      assert: finance GET /export?from&to returns CSV of approved expenses only
      weight: 2
    - id: persist
      assert: state survives restart (postgres); migrations create schema
      weight: 1
    - id: tests-green
      assert: vitest passes, coverage >= 80
      weight: 1
  ux:
    - id: responsive
      assert: submit + approval views work at 375/768/1280 without overflow
      weight: 1
    - id: a11y
      assert: axe via /browse zero serious/critical on submit + list views
      weight: 2
    - id: e2e-flow
      assert: /browse drives submit expense -> manager approves -> appears approved
      weight: 2
    - id: states
      assert: loading / empty / error (rejected, upload too large) states render
      weight: 1
  devops:
    - id: dockerfile
      assert: multi-stage Dockerfile, non-root, HEALTHCHECK
      weight: 2
    - id: ci
      assert: CI runs lint+test+build+dep-scan green
      weight: 2
    - id: k8s
      assert: k8s manifests (Deployment+Service+probes) apply in a dry-run
      weight: 2
    - id: migrations
      assert: forward-only migrations create expenses + audit tables
      weight: 1
  monitoring:
    - id: health
      assert: /healthz + /readyz (readyz gated on postgres)
      weight: 2
    - id: metrics
      assert: /metrics prometheus with request + approval counters
      weight: 1
    - id: audit-trail
      assert: every state change writes an immutable audit row (who/when/what)
      weight: 2
    - id: logs-trace
      assert: structured JSON logs with request/correlation id
      weight: 1
  hardening:
    - id: oidc-authn
      assert: unauthenticated requests redirect/401 to SSO
      weight: 2
    - id: rbac
      assert: employee cannot approve; only manager can; finance-only export (403 otherwise)
      weight: 2
    - id: gdpr
      assert: per-user data export + delete endpoints; PII minimized in logs
      weight: 2
    - id: upload-guard
      assert: receipt upload rejects non image/pdf and >10MB (415/413)
      weight: 1
    - id: no-secrets
      assert: no hardcoded secrets; .env.example; secret-scan clean
      weight: 1
    - id: rate-limit
      assert: per-user rate limit returns 429 past threshold
      weight: 1
