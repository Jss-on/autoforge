# GENERATED by forge:requirements (interview, user-approved). Local dev tool.
# A real-time kanban that VISUALIZES forge's own build progress. Read-only over the
# repo's forge/*/ artifacts. Weights from MoSCoW (Must=2, Should=1).
name: kanban-board
summary: Local real-time kanban visualizing forge build progress — reads build-results.tsv (cards) + iterations.tsv (feed), file-watch + SSE live, read-only.
stack:
  language: typescript
  runtime: node
  server: express + chokidar + sse
  frontend: react
  bundler: vite
  test: vitest + testing-library
design:
  source: file
  ref: DESIGN.md         # Vercel-design-analysis — adopted into the board's DESIGN.md

acceptance:
  functional:
    - id: boots
      assert: server boots and binds 127.0.0.1:<port>; npm start launches it
      weight: 2
    - id: discover-runs
      assert: GET /api/runs lists all forge/*/ runs; UI run switcher selects one
      weight: 2
    - id: cards-from-results
      assert: build-results.tsv parsed into cards bucketed Backlog(fail)/In-Progress(latest-iteration rows)/Done(pass); skip muted
      weight: 2
    - id: activity-feed
      assert: iterations.tsv parsed into a chronological activity feed (slice, delta, keep/discard)
      weight: 1
    - id: sse-live
      assert: chokidar watch + SSE pushes an update within ~1s of a watched file changing
      weight: 2
    - id: panels
      assert: pass_rate trend chart + per-dimension progress bars + current phase/hop banner + click-card detail all render from the run data
      weight: 2
    - id: states
      assert: no-runs / empty-run / loading / SSE-disconnected states render
      weight: 1
    - id: tests-green
      assert: vitest passes (parser + components), coverage >= 80
      weight: 1
  ux:
    - id: responsive
      assert: board works at 375 / 768 / 1280 without overflow (columns stack on mobile)
      weight: 1
    - id: a11y
      assert: axe via /browse zero serious/critical on the board
      weight: 2
    - id: e2e-live
      assert: /browse — flip a build-results.tsv row fail->pass, the card moves Backlog->Done live (no reload)
      weight: 2
    - id: design-conformance
      assert: live computed styles match DESIGN.md tokens (palette, type, spacing); no off-system slop
      weight: 1
    - id: states-ux
      assert: empty + disconnected states are clear and styled
      weight: 1
  devops:
    - id: build
      assert: vite production build succeeds (server + web)
      weight: 2
    - id: ci
      assert: CI runs lint+test+build+dep-scan green
      weight: 1
    - id: launcher
      assert: single command (npm start) builds web + serves it + opens localhost
      weight: 1
  monitoring:
    - id: healthz
      assert: GET /healthz returns 200
      weight: 1
    - id: watch-status
      assert: UI shows live SSE/watch connection status (connected / reconnecting)
      weight: 1
    - id: logs
      assert: server emits structured JSON logs (run loaded, file changed, client connected)
      weight: 1
  hardening:
    - id: localhost-only
      assert: server binds 127.0.0.1 only (not 0.0.0.0); not reachable off-host
      weight: 2
    - id: read-only
      assert: server never writes/mutates the watched forge artifacts (open read-only)
      weight: 2
    - id: path-traversal
      assert: run id / file params are validated; cannot escape the forge/ root (../ rejected)
      weight: 2
    - id: no-secrets
      assert: no secrets; npm audit clean above moderate
      weight: 1
    - id: input-validation
      assert: malformed run id -> 400; missing run -> 404 (no crash)
      weight: 1
