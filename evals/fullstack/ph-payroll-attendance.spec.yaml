name: ph-payroll-attendance
summary: Biometric time & attendance for the PH payroll bureau — DigitalPersona U.are.U 4500 kiosk clock-in/out (WebSDK driver + simulator), consent-gated enrollment, AES-256-GCM template storage, 1:N identify via pluggable matcher (dev + SourceAFIS sidecar), punch→Attendance/TimeEntry derivation (grace/tardy/undertime/OT/night) feeding the existing payroll engine, kiosk device registry, corrections + OT approval, RLS + DPA hardening.
target: build-output/ph-payroll-bureau
stack:
  language: typescript
  framework: nextjs
  capture: "@digitalpersona/devices (WebSDK -> local DP agent) + simulator driver"
  matcher: "pluggable MatcherEngine: dev (deterministic) + sourceafis (.NET sidecar, docker-compose)"
  datastore: postgres (RLS; new tables FingerprintTemplate, AttendancePunch, KioskDevice)
  test: vitest + playwright/browse e2e (simulator driver + dev engine)
design:
  source: file
  ref: build-output/ph-payroll-bureau/DESIGN.md  # Modern Human Core — extend, do not fork

acceptance:
  logic:
    - id: l-att-pair-normal
      assert: defaults; IN 08:58 OUT 18:02 -> regular 8.00, tardy 0, undertime 0, OT 0 (2min < 30min OT threshold), status present
      weight: 2
      gate: true
      traces: [ATT-5, NFR-A9]
    - id: l-att-grace-waiver
      assert: IN 09:04 OUT 18:00 (grace 5) -> tardy 0, payableStart 09:00, regular 8.00
      weight: 2
      gate: true
      traces: [ATT-5, ATT-11, NFR-A9]
    - id: l-att-tardy
      assert: IN 09:20 OUT 18:00 -> tardyMinutes 20 (full lateness beyond grace), regular 7.67, status tardy
      weight: 2
      gate: true
      traces: [ATT-5, NFR-A9]
    - id: l-att-undertime
      assert: IN 09:00 OUT 17:30 -> undertimeMinutes 30, regular 7.50, status undertime
      weight: 2
      gate: true
      traces: [ATT-5, NFR-A9]
    - id: l-att-shift-night
      assert: shift 14:00-23:00 break 18:00 -> IN 14:00 OUT 23:00 gives regular 8.00, nightHours 1.00 (22:00-23:00 overlap)
      weight: 2
      gate: true
      traces: [ATT-5, ATT-11, NFR-A9]
    - id: l-att-ot-unapproved
      assert: IN 09:00 OUT 20:00 unapproved -> regular 8.00, pendingOt 2.00, otHours 0
      weight: 2
      gate: true
      traces: [ATT-5, ATT-6, NFR-A9]
    - id: l-att-ot-approved
      assert: same day OT-approved -> otHours 2.00, pendingOt 0
      weight: 2
      gate: true
      traces: [ATT-6, NFR-A9]
    - id: l-att-dedup
      assert: punches 09:00:00 and 09:00:45 (same employee) -> 60s debounce leaves a single IN punch
      weight: 2
      gate: true
      traces: [ATT-4, NFR-A9]
    - id: l-att-incomplete
      assert: single punch (IN only) -> day incomplete, hours 0, no TimeEntry emitted until corrected
      weight: 2
      gate: true
      traces: [ATT-5, ATT-7, NFR-A9]
