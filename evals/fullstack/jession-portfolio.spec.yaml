      assert: "live UI matches design-brief tokens: Hanken Grotesk UI + Source Serif 4 reading text, #fcfbf9 ground, #242424 ink, #c93d17 accent on <=5% of screen, pill buttons/chips, hairline #ebe9e4 dividers, 4px radius thumbs / 8px cards (design-scan --design forge/requirements-260824-0201/design-brief.md: no font/color/radius drift)"
