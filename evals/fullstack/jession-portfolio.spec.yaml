      weight: 2
      gate: true
      traces: [FR-1, LR-1, GV-1a, GV-1b, GV-1c]
    - id: l-gv2-post-order
      assert: "posts published_at 2026-07-01, 2026-05-10, 2026-07-15 -> /writing order [07-15, 07-01, 05-10]"
      weight: 2
      gate: true
      traces: [FR-4, LR-2, GV-2]
    - id: l-gv3-slug
      assert: "slugify 'Pattern console for live market data!' -> 'pattern-console-for-live-market-data'; '  Hanai  Request  Intake ' with existing hanai-request-intake -> 'hanai-request-intake-2'; 'Café Résumé — v2' -> 'cafe-resume-v2'; max 80 chars"
      weight: 2
      gate: true
      traces: [FR-15, LR-3, GV-3a, GV-3b, GV-3c]
    - id: l-gv4-reading-time
      assert: "reading minutes = max(1, ceil(words/200)) — 0->1, 199->1, 200->1, 201->2, 1000->5 (words = whitespace tokens of markdown minus image syntax)"
      weight: 2
      gate: true
      traces: [FR-18, LR-4, GV-4]
    - id: l-gv5-schedule-live
      assert: "live predicate — scheduled publish_at 2026-09-01T09:00+08:00 (=01:00Z): at 2026-09-01T00:59:59Z NOT live (404, absent from lists/RSS/sitemap); at 01:00:00Z live; evaluated at request time, no cron"
      weight: 2
      gate: true
      traces: [FR-21, LR-5, GV-5a, GV-5b]
    - id: l-gv6-lockout
      assert: "LR-6 — 4 wrong passwords then correct+TOTP -> signed in, counter reset; 5 wrong within 15min -> locked 15min from 5th failure and correct password refused with same generic message during lock"
      weight: 2
      gate: true
      traces: [FR-13, LR-6, GV-6a, GV-6b]
    - id: l-gv7-image-rules
      assert: "LR-7 — 4000x3000 8.1MB PNG -> 2000x1500 WebP with EXIF stripped; 1200x800 JPEG -> 1200x800 WebP (no upscale); 25MB -> rejected 'larger than 20 MB'; exe bytes named .png -> rejected 'Not an image'; 21st image -> rejected 'Up to 20 images'"
      weight: 2
      gate: true
      traces: [FR-17, LR-7, GV-7a, GV-7b, GV-7c, GV-7d, GV-7e]
    - id: l-gv8-validation
      assert: "LR-8 — summary 161 chars -> validation error, 160 accepted; whatsapp '09171234567' -> error (E.164 required), '+639171234567' accepted and rendered wa.me/639171234567; live_url 'console.example' -> error (https required)"
      weight: 2
      gate: true
      traces: [FR-15, FR-20, LR-8, GV-8a, GV-8b]
    - id: l-gv9-pagination
      assert: "LR-9 — 25 live projects -> pages (12,12,1); ?page=4 -> 404; ?page=0 -> page 1; 0 items -> 1 page with empty state"
      weight: 2
      gate: true
      traces: [FR-2, LR-9, GV-9]
    - id: l-gv10-session-expiry
      assert: "LR-10 — last_seen 2026-08-01T00:00Z, request 2026-08-08T00:00:01Z -> expired (idle 7d); created 2026-07-01 with daily activity, request 2026-07-31T00:00:01Z -> expired (absolute 30d)"
      weight: 2
      gate: true
      traces: [FR-14, LR-10, GV-10]
    - id: l-gv11-featured-cap
      assert: "LR-11 — 6 featured, toggling a 7th refused with 'Up to 6 featured projects'; unfeature one -> 7th toggle succeeds"
      weight: 2
      gate: true
      traces: [FR-15, LR-11, GV-11]
    - id: l-gv12-backup-roundtrip
      assert: "LR-12 — export(3 projects/7 images, 2 posts, 4 experience, 3 skill groups, settings) -> import into fresh install: identical counts, slugs, order, tags, settings; image sha256 equal; export JSON contains no password_hash/totp_secret/recovery code fields"
      weight: 2
      gate: true
      traces: [FR-22, LR-12, GV-12]
  functional:
    - id: f-fresh-empty
      assert: "fresh deploy with empty DB: / renders hero from defaults with 'Projects coming soon', no seeded projects/posts/experience anywhere (public + admin), /admin routes to setup wizard (anti-demo: fresh tenant starts EMPTY)"
