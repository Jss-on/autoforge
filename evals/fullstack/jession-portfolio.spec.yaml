    - id: m-analytics
      assert: "cookieless Vercel Analytics wired on public routes, honoring the settings toggle (off -> no beacon script)"
      weight: 1
      traces: [FR-27, D4, NFR-7]
    - id: m-web-vitals
      assert: "Web Vitals (LCP/CLS/INP) reported (Speed Insights or equivalent) so regressions are visible post-deploy"
      weight: 1
      traces: [NFR-9]
  hardening:
    - id: h-authz-admin
      assert: "every /admin route and every mutating server action requires a valid owner session (unauth -> redirect/401); drafts/scheduled-future content unreachable publicly by URL, list, sitemap, RSS, or OG endpoint"
      weight: 2
      traces: [NFR-6, FR-13]
    - id: h-headers
      assert: "responses carry CSP (nonce-based scripts, no unsafe-inline for scripts, set via HTTP header), HSTS, X-Content-Type-Options: nosniff, Referrer-Policy: strict-origin-when-cross-origin, Permissions-Policy; verified on / and /admin"
      weight: 2
      traces: [NFR-6, D7]
    - id: h-csrf
      assert: "mutating server actions/routes reject requests whose Origin/Host mismatch (cross-site POST forged from another origin fails); session cookie SameSite=Lax"
      weight: 2
      traces: [NFR-6, D7]
    - id: h-upload-validation
      assert: "uploads validated by magic bytes + size + count server-side (client checks are advisory); stored under unguessable blob keys; content-type set from sniffed type, never from the client"
      weight: 2
      traces: [FR-17, LR-7, NFR-6]
    - id: h-markdown-xss
      assert: "markdown body containing <script>, <img onerror=...>, javascript: links renders sanitized (payload inert) on public pages and in preview"
      weight: 2
      traces: [FR-16, NFR-6]
    - id: h-rate-limit
      assert: "login and password-reset endpoints enforce LR-6 lockout + per-IP throttling; reset endpoint responds identically for unknown emails (no enumeration)"
      weight: 2
      traces: [FR-13, LR-6, NFR-6]
    - id: h-secrets
      assert: "no secrets in the repo (scan); backup export contains none; TOTP secret stored encrypted; recovery codes + reset tokens stored hashed"
      weight: 2
      traces: [NFR-6, NFR-7, FR-22]
    - id: h-deps-audit
      assert: "npm audit reports no high/critical vulnerabilities at build time"
      weight: 1
      traces: [NFR-6]
    - id: h-perf-cwv
      assert: "lighthouse mobile on /, a project page, a post (3 projects x 6 images seeded in the TEST fixture): performance >=90, LCP <=2.5s, CLS <=0.1 (emulated 4G); fonts via next/font, images via next/image with sizes"
      weight: 2
      traces: [NFR-1, NFR-2, G-1]
    - id: h-js-budget
      assert: "public routes ship <=120kB gzipped client JS (measured on /); no client JS needed to read content (works with JS disabled except theme toggle/uploads)"
      weight: 1
      traces: [NFR-2]
    - id: h-isr-load
      assert: "content routes use ISR 60s + revalidateTag on publish/unpublish; smoke load of 200 concurrent readers on / and a project page keeps p95 <1s (local autocannon against next start)"
      weight: 1
      traces: [NFR-12, LR-5]
