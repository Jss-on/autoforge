      assert: "GET /api/health returns 200 {ok:true, db:ok, blob:ok, version} in <1s; returns 503 with the failing dependency named when DB unreachable"
      weight: 2
      traces: [FR-27, NFR-8]
    - id: m-structured-logs
      assert: "server logs are structured JSON with request id, route, status, duration; errors logged with stack; no PII (no passwords/tokens) in logs"
      weight: 2
