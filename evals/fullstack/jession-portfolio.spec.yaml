# GENERATED by forge:requirements via 11-round interactive interview, playback signed off 2026-08-24.
# SRS: forge/requirements-260824-0201/requirements.md · Interview: interview-log.md · Weights: Must=2, Should=1.
# Anti-demo: fresh install starts EMPTY (wizard), data persists across restart, full CRUD on every entity, settings, backup.
name: jession-portfolio
summary: Personal portfolio + writing site at jession.hanai.dev (employers first, clients via email/WhatsApp) with an owner admin CMS — projects/posts with markdown + image uploads (Blob, sharp→WebP), profile/experience/skills/settings CRUD, TOTP-MFA single-owner auth, scheduling, backup/restore, SEO/OG/RSS, Medium-register "Paper Ledger" design, Next.js 15 + Neon Postgres + Vercel Blob on Vercel.
stack:
  language: typescript (strict)
  runtime: node 20+ (vercel serverless + edge where apt)
  framework: next 15 app router (server actions, ISR 60s + revalidateTag on publish, next/image, next/font, next/og)
  datastore: neon postgres (vercel marketplace) + drizzle orm + drizzle-kit migrations
  files: vercel blob via @vercel/blob (client upload for >4.5MB bodies) + sharp (resize <=2000px, webp q80, strip EXIF)
  auth: own — @node-rs/argon2 (argon2id), otplib TOTP RFC6238 + qrcode, hashed recovery codes, DB sessions (httpOnly SameSite=Lax), hibp k-anonymity breached-password check
  email: resend (password reset + email-change verify only; no marketing)
  validation: zod on every server action / route handler
  markdown: remark/rehype + remark-gfm + rehype-sanitize + shiki (rehype-pretty-code)
  seo: native sitemap.ts/robots.ts, feed (RSS), schema-dts JSON-LD, generated OG images 1200x630
  styling: tailwind v4 with tokens mapped from DESIGN.md frontmatter
  test: vitest (lib >=80%) + playwright e2e (S-1..S-11, mobile+desktop) + @axe-core/playwright + lighthouse ci
  deploy: vercel, private repo Jss-on/jession-portfolio, github actions CI, domain jession.hanai.dev (hanai.dev NS already on vercel)
  constraints: vercel hobby ok — no cron dependency for scheduling (request-time LR-5), serverless body 4.5MB -> blob client uploads

design:
  source: file
  ref: forge/requirements-260824-0201/design-brief.md   # "Jession — Paper Ledger", DESIGN_LINT: VALID
  mode: persuade   # home; case study/writing/about = read; /admin = operate (per-surface, see brief)
  dislikes: [oversized editorial headline (>=70px), full-bleed colored hero band, screenshot/cover inside the hero, dark theme as default, Result line on project rows, Writing section on home, facts strip on case study, side-by-side markdown editor, black-and-white-only palette, cream+oxblood reflex palette, neon-on-dark hanai look]

