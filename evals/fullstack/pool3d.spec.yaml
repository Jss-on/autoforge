# autoresearch:build eval spec — declares what to build + per-dimension acceptance.
# Generated by autoresearch:requirements from a signed-off SRS.
# Product: "Pool3D" — a realistic 3D billiards game (8-ball + 9-ball), local 2-player
# hotseat, with a first/third-person camera toggle and sound. Client-only web game.
name: pool3d
summary: >-
  Realistic 3D billiards in the browser. A green-felt pool hall with numbered
  balls and physical cue play: aim, set power, and put draw/follow/side spin on
  the cue ball. Two selectable rulesets — 8-ball and 9-ball — played as a local
  two-player hotseat with turn handling, fouls (scratch / wrong-ball-first /
  no-rail), ball-in-hand, and per-variant win detection. A first/third-person
  camera toggle: orbit/overhead by default, switch to a first-person cue-eye view
  to line up the shot. SFX (cue strike, velocity-scaled clacks, pocket, rail) plus
  music with a persistent mute. Realistic physics via Rapier (wasm) rigid bodies
  with a spin model layer (true masse/jump shots are out of scope). Per-device
  local stats. Desktop mouse + mobile touch, responsive. Installable PWA that
  plays offline. Public casual game. Free, static deploy to Vercel.
stack:
  language: typescript
  runtime: browser
  framework: three                 # Three.js (3D / WebGL render)
  physics: rapier                  # @dimforge/rapier3d (wasm) rigid-body sim + spin model layer
  bundler: vite
  frontend: vanilla-ts             # no React; TS modules for sim, rules, render, HUD, input
  datastore: localstorage          # client-only; NO server, NO database
  pwa: true
  deploy: vercel-static
  test: vitest+playwright
design:
  source: generate                 # catalog | file | url | generate
  ref: ""                          # build runs design-consultation -> DESIGN.md: REALISTIC POOL HALL
                                   # (green felt, polished wood rails, numbered balls, warm lamp light)

acceptance:
  functional:
    - id: builds
      assert: vite production build (static) succeeds from a clean checkout
      weight: 1
      traces: [NFR-12]
    - id: boots
      assert: app serves and renders the start menu (variant select) on localhost
      weight: 1
      traces: [FR-12]
    - id: table-and-rack
      assert: a 3D table with 16 balls (cue + 1-15) renders; the rack matches the chosen variant (8-ball triangle / 9-ball diamond)
      weight: 2
      traces: [FR-1, FR-15]
    - id: aim
      assert: mouse (desktop) and touch (mobile) set the shot direction and an aiming guideline is shown from the cue ball
      weight: 2
      traces: [FR-2]
    - id: power-strike
      assert: a drag/pull sets shot power and releasing strikes the cue ball with proportional speed
      weight: 2
      traces: [FR-3]
    - id: spin-english
      assert: choosing a cue-ball contact point applies draw / follow / side spin that changes the cue ball's post-contact path
      weight: 2
      traces: [FR-4]
    - id: physics
      assert: Rapier rigid-body sim resolves ball-ball and ball-cushion collisions with rolling friction; balls fall into pockets; the step is fixed-timestep deterministic
      weight: 2
      traces: [FR-5]
    - id: rulesets
      assert: 8-ball and 9-ball are selectable; each uses the correct rack and win condition (8-ball group+8 / 9-ball lowest-first, sink the 9)
      weight: 2
      traces: [FR-6]
    - id: hotseat-turns
      assert: two players alternate turns with a turn indicator; ball-in-hand is granted after a foul; the correct player is declared the winner
      weight: 2
      traces: [FR-7]
    - id: fouls
      assert: scratch (cue pocketed), wrong-ball-first, and no-rail fouls are detected per variant and pass the turn with ball-in-hand
      weight: 2
      traces: [FR-8]
    - id: camera-toggle
      assert: the camera defaults to a third-person orbit/overhead view and toggles to a first-person cue-eye view and back
      weight: 2
      traces: [FR-9]
    - id: audio-mute
      assert: SFX (cue strike, velocity-scaled ball clacks, pocket, rail) + music play; a mute toggle silences all audio and persists
      weight: 1
      traces: [FR-10]
    - id: local-stats
      assert: games played, wins per player/variant, and best break persist in localStorage across reloads
      weight: 2
      traces: [FR-11]
    - id: controls
      assert: aim, power, and spin are all usable via mouse on desktop and via touch on mobile
      weight: 2
      traces: [FR-13]
    - id: tests-green
      assert: vitest unit suite passes; coverage >= 80 on game-logic modules (rules, fouls, spin model, stats, rack)
      weight: 1
      traces: [NFR-15]
    - id: aim-projection-spin
      assert: the projected aim guide is visible while aiming and its shape varies with the cue-ball contact point — centre hit = straight, side english curves it (projectAim)
      weight: 2
      traces: [FR-16]
    - id: target-highlight
      assert: the next legal ball(s) to hit are highlighted on the table (9-ball lowest; 8-ball group / open / 8), updating each turn (ballOn)
      weight: 2
      traces: [FR-17]
    - id: bounce-path
      assert: the projected aim guide reflects off the cushions (banks) up to a few rails and stops at the first object ball it would contact (projectPath)
      weight: 2
      traces: [FR-18]
  ux:
    - id: responsive
      assert: table + menus + HUD work at 375px / 768px / 1280px
      weight: 2
      traces: [NFR-1, design:layout]
    - id: touch-controls
      assert: aim, power, and spin are usable via touch on a 375px viewport
      weight: 2
      traces: [NFR-2]
    - id: e2e-flow
      assert: /browse drives pick-variant -> aim -> power -> strike -> balls move/pocket -> turn passes -> game-over
      weight: 2
      traces: [NFR-16]
    - id: states
      assert: menu / playing (turns) / game-over screens all render; the turn indicator and winner are shown
      weight: 1
      traces: [FR-12]
    - id: a11y
      assert: axe scan via /browse reports zero serious/critical violations on menus; menus keyboard-operable; prefers-reduced-motion honored
      weight: 1
      traces: [NFR-3]
    - id: design-conformance
      assert: live computed styles + scene palette match DESIGN.md tokens (realistic pool-hall color/type/spacing/motion); no off-system slop
      weight: 2
      traces: [NFR-4, design:type, design:color, design:spacing, design:radius, design:motion, design:states]
    - id: aim-guides-live
      assert: /browse shows the dotted aim projection (straight on centre hit, curved with side english) plus the highlight ring on the target ball during aiming
      weight: 2
      traces: [FR-16, FR-17]
    - id: bounce-guide-live
      assert: /browse shows the dotted guide banking off the cushions on an angled aim (multi-rail zig-zag) and stopping at the first ball
      weight: 2
      traces: [FR-18]
  devops:
    - id: build-static
      assert: the build produces a static bundle (incl. the Rapier wasm asset) that needs no server runtime
      weight: 2
      traces: [NFR-12]
    - id: ci
      assert: CI runs lint + typecheck + test + build, all green
      weight: 1
      traces: [NFR-13]
    - id: deploy-vercel
      assert: documented one-command deploy to Vercel (static) succeeds
      weight: 2
      traces: [NFR-14]
    - id: pwa-installable
      assert: valid web app manifest + service worker; Lighthouse marks the app installable
      weight: 2
      traces: [FR-14]
    - id: offline-play
      assert: with the network offline, the app loads from cache (incl. the wasm) and is fully playable
      weight: 2
      traces: [FR-14]
  monitoring:
    - id: fps-budget
      assert: gameplay sustains ~60fps (frame time <= ~16.7ms) over a sampled shot on a mid-range profile; physics on a fixed step
      weight: 2
      traces: [NFR-5]
    - id: web-vitals
      assert: Lighthouse performance >= 90; LCP < 3s on a throttled cold load (Rapier wasm lazy-loaded so it does not block first paint)
      weight: 2
      traces: [NFR-6]
    - id: error-boundary
      assert: runtime / WebGL / wasm-load errors are caught and surfaced (graceful error screen), never a blank canvas
      weight: 1
      traces: [NFR-7]
    - id: no-console-errors
      assert: no console errors are emitted during a full shot-to-game-over playthrough
      weight: 1
      traces: [NFR-7]
  hardening:
    - id: no-secrets
      assert: no secrets in the shipped bundle; secret-scan is clean
      weight: 1
      traces: [NFR-8]
    - id: no-network-gameplay
      assert: gameplay issues zero network requests; all assets (incl. wasm) are same-origin and cached
      weight: 1
      traces: [NFR-9]
    - id: storage-safe
      assert: localStorage reads are validated/guarded; corrupt, missing, or oversized data cannot crash the game
      weight: 2
      traces: [NFR-10]
    - id: csp-headers
      assert: security headers / CSP set via static-host HTTP headers; script-src includes 'wasm-unsafe-eval' for Rapier; frame-ancestors is header-only (never <meta>)
      weight: 1
      traces: [NFR-11]
