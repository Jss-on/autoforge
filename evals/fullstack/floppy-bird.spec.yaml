# forge:build eval spec — declares what to build + per-dimension acceptance.
# Generated by forge:requirements (260628-1240) from a signed-off SRS.
# Product: "Floppy Bird" — a Flappy-Bird-style arcade game as a client-only web game.
name: floppy-bird
summary: >-
  Browser remake of "Flappy Bird": tap/space/click to flap a bird through
  scrolling pipe gaps, +1 per pipe cleared, crash on pipe or ground.
  Client-only (NO backend): 3 fixed difficulty modes (Easy/Normal/Hard),
  per-device top-10 local high scores with 3-letter arcade initials, free
  selectable bird skins, a day->night background that auto-transitions as the
  score climbs, SFX + music with a persistent mute, full keyboard + mouse +
  touch controls, responsive, installable PWA that plays offline. Personal /
  portfolio piece. Free, static deploy to Vercel.
stack:
  language: typescript
  runtime: browser
  framework: phaser            # Phaser 3 (2D game framework)
  bundler: vite
  frontend: phaser-scenes      # no React; Phaser Scenes for menus + HUD + game
  datastore: localstorage      # client-only; NO server, NO database
  pwa: true
  deploy: vercel-static
  test: vitest+playwright
design:
  source: generate             # catalog | file | url | generate
  ref: ""                      # build runs design-consultation -> writes DESIGN.md (polished arcade)

acceptance:
  functional:
    - id: builds
      assert: vite production build (static) succeeds from a clean checkout
      weight: 1
      traces: [NFR-14]
    - id: boots
      assert: app serves and renders the start menu on localhost
      weight: 1
      traces: [FR-8]
    - id: flap-core
      assert: tap / space / click applies an upward impulse; gravity pulls the bird down each frame
      weight: 2
      traces: [FR-1]
    - id: pipes-scroll
      assert: pipe pairs spawn with a vertical gap and scroll right-to-left across the play area
      weight: 2
      traces: [FR-2]
    - id: scoring
      assert: clearing a pipe increments the score by 1 and the live score is displayed during play
      weight: 2
      traces: [FR-3]
    - id: collision-gameover
      assert: colliding with a pipe or the ground ends the run and shows the game-over screen
      weight: 2
      traces: [FR-4]
    - id: difficulty-modes
      assert: Easy / Normal / Hard set pipe gap + scroll speed; Normal is default; mode is chosen before a run
      weight: 2
      traces: [FR-5]
    - id: local-highscores
      assert: on game-over, 3-letter initials are entered; one combined top-10 persists in localStorage and renders
      weight: 2
      traces: [FR-6]
    - id: controls
      assert: flap works via keyboard (space) and mouse click on desktop and via tap on touch devices
      weight: 2
      traces: [FR-7]
    - id: skins
      assert: multiple bird skins are all free to select; the chosen skin persists across sessions
      weight: 1
      traces: [FR-10]
    - id: daynight-auto
      assert: the background auto-transitions from day toward night as the score climbs
      weight: 1
      traces: [FR-11]
    - id: audio-mute
      assert: sound effects + music play; a mute toggle silences all audio and the mute state persists
      weight: 1
      traces: [FR-9]
    - id: tests-green
      assert: vitest unit suite passes; coverage >= 80 on game-logic modules
      weight: 1
      traces: [NFR-16]
  ux:
    - id: responsive
      assert: gameplay + menus work at 375px / 768px / 1280px
      weight: 2
      traces: [NFR-1, design:layout]
    - id: touch-controls
      assert: tap-to-flap and menu buttons are usable on a 375px viewport
      weight: 2
      traces: [NFR-2]
    - id: e2e-flow
      assert: /browse drives start -> pick difficulty -> play -> score -> game-over -> enter initials -> see top-10
      weight: 2
      traces: [NFR-17]
    - id: states
      assert: start / playing / paused / game-over screens all render; pause resumes correctly
      weight: 1
      traces: [FR-8]
    - id: a11y
      assert: axe scan via /browse reports zero serious/critical violations on menus; menus keyboard-operable
      weight: 1
      traces: [NFR-3]
    - id: design-conformance
      assert: live computed styles match DESIGN.md tokens (palette, type, spacing, motion); no off-system slop
      weight: 2
      traces: [NFR-4, design:type, design:color, design:spacing, design:radius, design:motion, design:states]
  devops:
    - id: build-static
      assert: the build produces a static bundle that needs no server runtime
      weight: 2
      traces: [NFR-13]
    - id: ci
      assert: CI runs lint + typecheck + test + build, all green
      weight: 1
      traces: [NFR-14]
    - id: deploy-vercel
      assert: documented one-command deploy to Vercel (or any static host) succeeds
      weight: 2
      traces: [NFR-15]
    - id: pwa-installable
      assert: valid web app manifest + service worker; Lighthouse marks the app installable
      weight: 2
      traces: [FR-12]
    - id: offline-play
      assert: with the network offline, the app loads from cache and is fully playable
      weight: 2
      traces: [FR-12]
  monitoring:
    - id: fps-budget
      assert: gameplay sustains ~60fps (frame time <= ~16.7ms) over a sampled play session
      weight: 2
      traces: [NFR-5]
    - id: web-vitals
      assert: Lighthouse performance >= 90; LCP < 3s on a throttled cold load
      weight: 2
      traces: [NFR-6]
    - id: error-boundary
      assert: runtime errors are caught and surfaced (graceful error screen), never a blank white canvas
      weight: 1
      traces: [NFR-7]
    - id: no-console-errors
      assert: no console errors are emitted during a full playthrough
      weight: 1
      traces: [NFR-7]
  hardening:
    - id: no-secrets
      assert: no secrets in the shipped bundle; secret-scan is clean
      weight: 1
      traces: [NFR-8]
    - id: no-network-gameplay
      assert: gameplay issues zero network requests; everything runs client-side
      weight: 1
      traces: [NFR-9]
    - id: storage-safe
      assert: localStorage reads are validated/guarded; corrupt or oversized data cannot crash the game
      weight: 2
      traces: [NFR-10]
    - id: input-sanitize
      assert: initials input is bounded and sanitized (length + charset) before persist/render
      weight: 1
      traces: [NFR-11]
    - id: csp-headers
      assert: security headers / CSP are set via host headers or meta (static-host compatible)
      weight: 1
      traces: [NFR-12]
