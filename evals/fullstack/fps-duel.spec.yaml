# forge:build eval spec — declares what to build + per-dimension acceptance.
# Generated by forge:requirements from a signed-off SRS
# (forge/requirements-260628-1732/requirements.md).
# Product: "fps-duel" — a 1v1 first-person shooter in the browser. Two humans duel in
# real time over WebRTC P2P (private room code) in one low-poly arena, hot-swapping a
# Beatrix-style loadout: a hitscan SNIPER (scoped, high-damage) and an arcing CANNON
# (AoE splash). First to the host-set kill target wins. Cross-platform: desktop
# (mouse-look + WASD) and mobile (touch). Host-authoritative netcode with client
# prediction + interpolation. Client-only game + a thin serverless signaling endpoint.
name: fps-duel
summary: >-
  A two-player 1v1 first-person shooter on the web. Two humans connect peer-to-peer
  over WebRTC via a private room code/link (a serverless endpoint only brokers the
  handshake) and duel in real time in a single low-poly arena. Beatrix-style swappable
  loadout: a SNIPER (hitscan, aim-down-sights scoped zoom, high damage, small magazine)
  and a CANNON (gravity-arced projectile with area-of-effect splash + radial falloff),
  hot-swapped mid-fight with per-weapon ammo + reload. Movement is WASD + jump + sprint
  with collision and verticality. First player to the host-configured kill target wins;
  death triggers a timed respawn. Host peer is authoritative for hit detection, health,
  deaths and score; the guest runs client-side prediction + interpolation and reconciles.
  Cross-platform and responsive: pointer-lock mouse-look + keyboard on desktop, dual
  sticks + buttons on mobile touch. HUD/scoreboard (names, score vs target, health,
  weapon + ammo, reticle, ping + connection state), rematch on the same connection,
  player display name, on-device stats (K/D, matches won), SFX + music with persistent
  mute, and graceful opponent-disconnect handling. Untrusted peer + signaling messages
  are schema-validated and bounds-checked. Free, no accounts. Static client + serverless
  signaling, one-command deploy to Vercel.
stack:
  language: typescript
  runtime: browser
  framework: three                 # Three.js (3D / WebGL render, first-person camera)
  bundler: vite
  frontend: vanilla-ts             # no React; TS modules for sim, weapons, netcode, render, HUD, input
  netcode: webrtc                  # RTCPeerConnection + DataChannel; host-authoritative sim
  signaling: serverless            # Vercel serverless function brokers SDP/ICE; STUN + TURN fallback
  datastore: localstorage          # client-only stats/name/mute; NO database, NO server gameplay state
  deploy: vercel                   # static client + serverless signaling function
  test: vitest+playwright          # playwright drives TWO browser contexts (host + guest) for the duel e2e
design:
  source: generate                 # catalog | file | url | generate
  ref: ""                          # build runs design-consultation -> DESIGN.md: LOW-POLY STYLIZED ARENA
                                   # (bold flat team colors orange vs teal, neutral grey geometry,
                                   #  geometric/techno display + clean HUD sans, snappy motion)

acceptance:
  functional:
    - id: builds
      assert: vite production build (static client) succeeds from a clean checkout
      weight: 2
      traces: [NFR-12]
    - id: boots
      assert: app serves and renders the main menu (create / join) on localhost
      weight: 2
      traces: [FR-13]
    - id: controls
      assert: desktop pointer-lock engages on canvas click; mouse moves the first-person view and WASD moves the player
      weight: 2
      traces: [FR-1]
    - id: movement
      assert: movement collides with arena geometry; jump changes height and sprint changes speed; the player cannot leave the world / fall out of bounds
      weight: 2
      traces: [FR-2]
    - id: weapon-swap
      assert: exactly two weapons (sniper, cannon) exist; the swap input switches the active weapon, the HUD updates, and firing is blocked until the swap completes
      weight: 2
      traces: [FR-3]
    - id: sniper
      assert: the sniper is hitscan with aim-down-sights scoped zoom, high damage, and a small magazine; a scoped shot at an enemy applies high damage along the ray
      weight: 2
      traces: [FR-4]
    - id: cannon
      assert: the cannon fires a gravity-arced projectile that, on impact, deals area-of-effect splash damage with radial falloff
      weight: 2
      traces: [FR-5]
    - id: ammo-reload
      assert: each weapon has a magazine that depletes on fire; reload refills it and the HUD ammo count updates; an empty weapon cannot fire until reloaded
      weight: 2
      traces: [FR-6]
    - id: damage-health
      assert: shots and splash reduce the target's health; reaching 0 health is a death that credits the attacker exactly one kill
      weight: 2
      traces: [FR-7]
    - id: respawn
      assert: a dead player respawns after a fixed delay at a spawn point with full health and refreshed ammo
      weight: 2
      traces: [FR-8]
    - id: scoring
      assert: first player to reach the host-configured kill target wins; the target is selectable before the match and the winner is declared at match-over
      weight: 2
      traces: [FR-9]
    - id: p2p-sync
      assert: over the WebRTC DataChannel, each peer's position, orientation, active weapon, shots, hits, deaths, and score are reflected on the other peer in real time
      weight: 2
      traces: [FR-10]
    - id: room-connect
      assert: host creates a match and gets a room code + shareable link; the guest joins by code; the serverless signaling endpoint brokers the SDP/ICE handshake and the DataChannel opens
      weight: 2
      traces: [FR-11]
    - id: netcode-authority
      assert: the host peer is authoritative for hit detection / health / deaths / score; the guest predicts + interpolates and reconciles to host state with no permanent desync
      weight: 2
      traces: [FR-12, NFR-9]
    - id: match-states
      assert: menu -> create/join -> lobby (ready + set kill target) -> playing -> match-over all render and transition correctly
      weight: 2
      traces: [FR-13]
    - id: hud
      assert: the HUD/scoreboard shows both player names, score vs kill target, own health, active weapon + ammo, and a crosshair/scope reticle, updating live
      weight: 2
      traces: [FR-14]
    - id: arena
      assert: one low-poly arena loads with cover, verticality, and at least two spawn points; sniper sightlines and cannon splash spots are both present
      weight: 2
      traces: [FR-19]
    - id: rematch
      assert: at match-over a rematch resets the score and restarts on the same peer connection without re-entering a code
      weight: 1
      traces: [FR-15]
    - id: player-name
      assert: each player sets a display name that is shown above their in-world avatar and on the scoreboard
      weight: 1
      traces: [FR-16]
    - id: local-stats
      assert: kills, deaths, K/D, and matches won persist per-device in localStorage across reloads
      weight: 1
      traces: [FR-17]
    - id: audio-mute
      assert: SFX (sniper crack, cannon launch + explosion, reload, hit marker, death) + music play; a mute toggle silences all audio and persists across reloads
      weight: 1
      traces: [FR-18]
    - id: disconnect
      assert: when a peer disconnects or the DataChannel closes, the survivor sees an "opponent disconnected" message and returns to the menu (never a frozen game)
      weight: 1
      traces: [FR-20]
    - id: tests-green
      assert: vitest unit suite passes; coverage >= 80 on game-logic modules (weapon models, projectile arc + splash, damage/health, scoring, netcode (de)serialization, stats)
      weight: 2
      traces: [NFR-15]
  ux:
    - id: responsive
      assert: menus + lobby + HUD + 3D view are usable at 375px / 768px / 1280px
      weight: 2
      traces: [NFR-1, design:layout]
    - id: touch-controls
      assert: move, look, fire, swap, reload, and jump are all operable via on-screen touch controls on a 375px viewport
      weight: 2
      traces: [NFR-2]
    - id: e2e-flow
      assert: a two-context /browse drive (host + guest) completes create-room -> join-by-code -> both spawn -> move/aim/fire/swap -> a hit registers -> score increments -> match-over, with no console errors
      weight: 2
      traces: [NFR-16]
    - id: states
      assert: menu / create-join / lobby / playing / match-over screens all render; the scoreboard and the declared winner are shown
      weight: 2
      traces: [FR-13]
    - id: a11y
      assert: axe scan via /browse reports zero serious/critical violations on the non-canvas screens; menus/lobby keyboard-operable; prefers-reduced-motion honored
      weight: 1
      traces: [NFR-3]
    - id: design-conformance
      assert: live computed styles + scene palette match DESIGN.md tokens (low-poly stylized color/type/spacing/radius/motion/states); no off-system slop
      weight: 2
      traces: [NFR-4, design:type, design:color, design:spacing, design:radius, design:motion, design:states]
  devops:
    - id: build-static
      assert: the build produces a static client bundle plus the serverless signaling function; the game client needs no server runtime for gameplay
      weight: 2
      traces: [NFR-12]
    - id: ci
      assert: CI runs lint + typecheck + test + build, all green
      weight: 1
      traces: [NFR-13]
    - id: deploy-vercel
      assert: one documented command deploys the static client + serverless signaling function to Vercel (incl. STUN/TURN + signaling env config)
      weight: 2
      traces: [NFR-14]
  monitoring:
    - id: fps-budget
      assert: gameplay sustains ~60fps (frame time <= ~16.7ms) over a sampled exchange on a mid-range profile
      weight: 1
      traces: [NFR-5]
    - id: web-vitals
      assert: Lighthouse performance >= 90; LCP < 3s on a throttled cold load; heavy 3D/audio assets lazy-loaded so they do not block first paint
      weight: 1
      traces: [NFR-6]
    - id: error-boundary
      assert: WebGL / WebRTC / asset-load errors are caught and surfaced as a graceful error screen, never a blank canvas
      weight: 1
      traces: [NFR-7]
    - id: no-console-errors
      assert: no console errors are emitted during a full menu-to-match-over two-peer playthrough
      weight: 1
      traces: [NFR-7]
    - id: netcode-health
      assert: round-trip ping/latency and connection state (connecting / connected / reconnecting / closed) are surfaced in the HUD; the state-sync tick runs at a fixed documented rate
      weight: 1
      traces: [NFR-17, FR-20]
  hardening:
    - id: peer-validation
      assert: all signaling messages AND peer DataChannel messages are schema-validated + bounds-checked; malformed, oversized, or out-of-range payloads are rejected and cannot crash or desync the host, and a guest cannot spoof score/health/kills
      weight: 2
      traces: [NFR-9, FR-12]
    - id: no-secrets
      assert: no secrets/keys in the shipped client bundle or signaling function; secret-scan is clean
      weight: 1
      traces: [NFR-8]
    - id: storage-safe
      assert: localStorage reads (stats, name, mute) are validated/guarded; corrupt, missing, or oversized data cannot crash the game
      weight: 1
      traces: [NFR-10]
    - id: csp-headers
      assert: security headers / CSP set via host HTTP headers; connect-src permits the signaling endpoint + STUN/TURN; frame-ancestors is header-only (never <meta>)
      weight: 1
      traces: [NFR-11]
    - id: signaling-abuse
      assert: room codes are high-entropy/unguessable; the signaling endpoint rate-limits room creation/join and expires stale rooms
      weight: 1
      traces: [NFR-18]
