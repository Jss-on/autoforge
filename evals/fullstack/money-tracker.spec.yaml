# GENERATED by autoresearch:requirements via 3-round interactive interview (no assumptions; user-approved).
# Architecture: LOCAL-FIRST PWA (Next.js client + IndexedDB), no server, no login, single device, USD.
# Ops dimensions are client-side (no Postgres/server). Weights from MoSCoW (Must=2, Should=1).
name: money-tracker
summary: Local-first personal finance PWA — transactions, budgets, dashboard; offline, IndexedDB, no login.
stack:
  language: typescript
  framework: nextjs
  rendering: client/static-export
  storage: indexeddb
  charts: recharts
  test: vitest + testing-library
  pwa: manifest + service-worker

acceptance:
  functional:
    - id: txn-crud
      assert: add/edit/delete transaction {amount,type,category,date,note} persists in IndexedDB
      weight: 2
    - id: categories
      assert: preset + user-defined categories usable on a transaction
      weight: 1
    - id: budgets
      assert: monthly budget per category; spend over budget is flagged/alerted
      weight: 2
    - id: dashboard
      assert: dashboard shows balance + income/expense totals + spend-by-category chart
      weight: 2
    - id: offline-persist
      assert: data survives reload AND full offline use (no network)
      weight: 2
    - id: csv-export
      assert: export transactions to CSV
      weight: 1
    - id: tests-green
      assert: vitest + testing-library pass, coverage >= 80
      weight: 1
  ux:
    - id: responsive
      assert: dashboard + entry form work at 375/768/1280 without overflow
      weight: 1
    - id: a11y
      assert: axe via /browse zero serious/critical on dashboard + add-transaction
      weight: 2
    - id: e2e-flow
      assert: /browse drives add expense -> dashboard balance + chart update -> reload persists
      weight: 2
    - id: pwa-offline
      assert: valid manifest + service worker; app loads + works offline after first visit (installable)
      weight: 2
    - id: states
      assert: loading / empty (no transactions) / error states render
      weight: 1
    - id: charts-readable
      assert: spend-by-category chart has labels + AA contrast
      weight: 1
  devops:
    - id: build
      assert: production Next.js build succeeds
      weight: 2
    - id: ci
      assert: CI runs lint+test+build+dep-scan green
      weight: 1
    - id: pwa-assets
      assert: web app manifest valid + service worker registered
      weight: 2
    - id: static-bundle
      assert: produces a deployable static bundle
      weight: 1
  monitoring:
    - id: error-boundary
      assert: React error boundary present; console clean during e2e flow
      weight: 1
    - id: web-vitals
      assert: captures + logs core web vitals (LCP/CLS/INP)
      weight: 1
    - id: bundle-budget
      assert: main JS bundle under the set size budget
      weight: 1
  hardening:
    - id: input-validation
      assert: invalid amount/date rejected with inline error (not saved)
      weight: 2
    - id: xss-safe
      assert: user note with HTML is rendered escaped (no script execution)
      weight: 2
    - id: csp-headers
      assert: CSP + security headers (nosniff, frame-options) configured
      weight: 1
    - id: dep-scan
      assert: npm audit clean above moderate
      weight: 1
    - id: data-on-device
      assert: no network request carries financial data off-device
      weight: 1
