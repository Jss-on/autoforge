# forge:build eval spec — declares what to build + per-dimension acceptance.
# Generated by forge:requirements (260628-1321) from a signed-off SRS.
# Product: "Dino3D" — Chrome's offline T-Rex runner reimagined as a first-person 3D browser game.
name: dino3d
summary: >-
  First-person 3D remake of Chrome's offline dino runner. You ARE the dino:
  cockpit view with the snout + clawed hands at the screen edges, the low-poly
  desert rushing toward you. Auto-run at ever-increasing speed; jump cacti and
  duck pterodactyls on a single timing lane; one hit ends the run. Live
  distance score with milestone blips, a day->night cycle as the score climbs,
  SFX + looping music with a persistent mute, and a per-device local high score.
  Client-only (NO backend, NO accounts, NO PII). Full keyboard (desktop) +
  swipe/touch (mobile), responsive. Installable PWA that plays fully offline.
  Public casual web game. Free, static deploy to Vercel.
stack:
  language: typescript
  runtime: browser
  framework: three             # Three.js (3D / WebGL)
  bundler: vite
  frontend: vanilla-ts         # no React; TS modules for game loop, scene, HUD, input
  datastore: localstorage      # client-only; NO server, NO database
  pwa: true
  deploy: vercel-static
  test: vitest+playwright
design:
  source: generate             # catalog | file | url | generate
  ref: ""                      # build runs design-consultation -> DESIGN.md: LOW-POLY DESERT
                               # (blue sky, sand dunes, cartoon cacti/rocks/pterodactyls)
                               # + first-person cockpit framing (snout + clawed hands)

acceptance:
  functional:
    - id: builds
      assert: vite production build (static) succeeds from a clean checkout
      weight: 1
      traces: [NFR-12]
    - id: boots
      assert: app serves and renders the start screen on localhost
      weight: 1
      traces: [FR-9]
    - id: fp-run-core
      assert: first-person camera shows the dino snout + clawed hands at screen edges; the low-poly desert auto-scrolls toward the player and run speed increases over time
      weight: 2
      traces: [FR-1, FR-2, FR-15]
    - id: jump
      assert: jump input (space / up-arrow / swipe-up) raises the camera in a gravity arc and clears ground obstacles, then returns to the ground
      weight: 2
      traces: [FR-3]
    - id: duck
      assert: duck input (down-arrow / swipe-down) lowers the camera + hitbox to pass under flying obstacles, releasing back to standing
      weight: 2
      traces: [FR-4]
    - id: obstacles-single-lane
      assert: cacti (ground) and pterodactyls (air) spawn ahead on one timing lane and approach the player; there is no sideways/lane movement
      weight: 2
      traces: [FR-5]
    - id: collision-gameover
      assert: colliding with any cactus or pterodactyl ends the run on the first hit and shows the game-over screen
      weight: 2
      traces: [FR-6]
    - id: scoring
      assert: score increases with distance/time and is shown live during play; a milestone cue fires every 100
      weight: 2
      traces: [FR-7]
    - id: daynight-auto
      assert: the sky/world auto-transitions from day toward night as the score climbs
      weight: 1
      traces: [FR-8]
    - id: local-highscore
      assert: the best score persists in localStorage across reloads and is shown on the start screen and game-over screen
      weight: 2
      traces: [FR-10]
    - id: audio-mute
      assert: SFX (jump / duck / milestone / hit) + looping music play; a mute toggle silences all audio and the mute state persists
      weight: 1
      traces: [FR-11]
    - id: controls
      assert: jump + duck work via keyboard on desktop and via swipe/touch on touch devices
      weight: 2
      traces: [FR-12]
    - id: tests-green
      assert: vitest unit suite passes; coverage >= 80 on game-logic modules (collision, scoring, spawn, speed-ramp, storage)
      weight: 1
      traces: [NFR-15]
  ux:
    - id: responsive
      assert: gameplay + menus work at 375px / 768px / 1280px
      weight: 2
      traces: [NFR-1, design:layout]
    - id: touch-controls
      assert: swipe-up = jump and swipe-down = duck, plus all menu buttons, are usable on a 375px viewport
      weight: 2
      traces: [NFR-2]
    - id: e2e-flow
      assert: /browse drives start -> play -> jump a cactus -> duck a pterodactyl -> score climbs -> crash -> game-over shows best score
      weight: 2
      traces: [NFR-16]
    - id: states
      assert: start / playing / paused / game-over screens all render; pause resumes correctly; the game auto-pauses on tab blur
      weight: 1
      traces: [FR-9, FR-14]
    - id: a11y
      assert: axe scan via /browse reports zero serious/critical violations on menus; menus are keyboard-operable; prefers-reduced-motion is honored
      weight: 1
      traces: [NFR-3]
    - id: design-conformance
      assert: live computed styles + scene palette match DESIGN.md tokens (low-poly desert color/type/spacing/motion); no off-system slop
      weight: 2
      traces: [NFR-4, design:type, design:color, design:spacing, design:radius, design:motion, design:states]
  devops:
    - id: build-static
      assert: the build produces a static bundle that needs no server runtime
      weight: 2
      traces: [NFR-12]
    - id: ci
      assert: CI runs lint + typecheck + test + build, all green
      weight: 1
      traces: [NFR-13]
    - id: deploy-vercel
      assert: documented one-command deploy to Vercel (static) succeeds
      weight: 2
      traces: [NFR-14]
    - id: pwa-installable
      assert: valid web app manifest + service worker; Lighthouse marks the app installable
      weight: 2
      traces: [FR-13]
    - id: offline-play
      assert: with the network offline, the app loads from cache and is fully playable
      weight: 2
      traces: [FR-13]
  monitoring:
    - id: fps-budget
      assert: gameplay sustains ~60fps (frame time <= ~16.7ms) over a sampled play session on a mid-range profile
      weight: 2
      traces: [NFR-5]
    - id: web-vitals
      assert: Lighthouse performance >= 90; LCP < 3s on a throttled cold load (4G)
      weight: 2
      traces: [NFR-6]
    - id: error-boundary
      assert: runtime/WebGL errors are caught and surfaced (graceful error screen), never a blank/black canvas
      weight: 1
      traces: [NFR-7]
    - id: no-console-errors
      assert: no console errors are emitted during a full playthrough
      weight: 1
      traces: [NFR-7]
  hardening:
    - id: no-secrets
      assert: no secrets in the shipped bundle; secret-scan is clean
      weight: 1
      traces: [NFR-8]
    - id: no-network-gameplay
      assert: gameplay issues zero network requests; everything runs client-side (offline-safe)
      weight: 1
      traces: [NFR-9]
    - id: storage-safe
      assert: localStorage reads are validated/guarded; corrupt, missing, or oversized data cannot crash the game
      weight: 2
      traces: [NFR-10]
    - id: csp-headers
      assert: security headers / CSP are set via static-host (Vercel) HTTP headers; frame-ancestors is header-only (never <meta>)
      weight: 1
      traces: [NFR-11]
