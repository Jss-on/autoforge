# GENERATED by forge:requirements via 3-round interactive interview (no assumptions; user sign-off 2026-06-29).
# Multi-tenant PH payroll BUREAU. Self-hosted Docker. Next.js + Postgres (RLS) + Prisma.
# Weights from MoSCoW (Must=2, Should=1). Priority: statutory correctness (gated golden oracle) first.
# SRS: forge/requirements-260629-2055/requirements.md
name: ph-payroll-bureau
summary: Multi-tenant Philippine payroll bureau — tenants/employees, attendance/leave, 2025 statutory engine (SSS/PhilHealth/Pag-IBIG/BIR/13th-month/DOLE premiums), payslip+register PDFs, gov't + BIR + multi-bank files; Postgres RLS isolation, MFA+RBAC, append-only audit, DPA baseline, self-hosted.
stack:
  language: typescript
  framework: nextjs
  rendering: server + client (app router)
  datastore: postgres
  isolation: row-level security (tenant_id + RLS policies)
  orm: prisma
  auth: email-password + TOTP MFA (admins) + role-based access control
  pdf: server-side PDF generation (payslips + register)
  test: vitest + testing-library + playwright
  api: REST / OpenAPI + api-keys + webhooks
  deploy: docker-compose (self-hosted, PH residency)

design:
  source: file
  ref: plugins/DESIGN.md  # "Modern Human Core" — warm corporate HR aesthetic (pink/burgundy, Hanken Grotesk)

